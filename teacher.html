<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>우리반 보드 · 선생님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
:root{
  --cream:#FFF9F0; --paper:#FFFFFF; --ink:#3A3550; --ink2:#7A7590; --line:#EEE6DA;
  --main:#7C8CFF; --main-soft:#E8EBFF; --danger:#F06A6A; --danger-soft:#FFE6E6; --ok:#3DBE8B; --ok-soft:#DDF6EC;
  --sky:#D6ECFF; --mint:#D3F5E6; --lemon:#FFF4BF; --peach:#FFE0D1; --lavender:#E8DFFF; --pink:#FFDDEA;
  --r:18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:15px}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 14px;transition:transform .1s,background .15s}
button:hover{background:#FBF6EE}
button:active{transform:scale(.97)}
button.main{background:var(--main);border-color:var(--main);color:#fff}
button.main:hover{background:#6B7BF0}
button.danger{color:var(--danger);border-color:#F8C9C9}
button.danger.fill{background:var(--danger);color:#fff;border-color:var(--danger)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:#F4EDE2}
button.sm{padding:5px 10px;font-size:13px;border-radius:10px}
input,select,textarea{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--main)}
textarea{resize:vertical;min-height:90px}
label.f{display:block;margin:12px 0 6px;color:var(--ink2);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink2)}
.sp{flex:1}

/* 상단 */
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--paper);border-bottom:1.5px solid var(--line);position:sticky;top:0;z-index:5}
.logo{font-family:'Jua';font-size:22px;display:flex;align-items:center;gap:8px}
.logo .bear{font-size:26px}
.top select{width:auto;min-width:160px}

/* 레이아웃 */
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 62px)}
.side{background:var(--paper);border-right:1.5px solid var(--line);padding:16px 12px;overflow:auto}
.content{padding:24px 28px;min-width:0}
.nav{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;cursor:pointer;user-select:none;border:2px dashed transparent}
.nav:hover{background:#FBF6EE}
.nav.on{background:var(--main-soft);color:#4B57C8}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--ink2)}
.nav .caret{width:16px;text-align:center;color:var(--ink2);font-size:11px}
.sideh{display:flex;align-items:center;justify-content:space-between;margin:16px 6px 6px;color:var(--ink2);font-size:13px}
.dropping{border-color:var(--main)!important;background:var(--main-soft)!important}
.newfolder{display:block;width:calc(100% - 8px);margin:6px 4px 4px;border:2px dashed #E3D8C8;background:transparent;color:var(--ink2);text-align:left;padding:9px 12px}
.newfolder:hover{border-color:var(--main);color:#4B57C8;background:var(--main-soft)}
.secttl{font-family:'Jua';font-size:16px;color:var(--ink2);margin:6px 2px 10px}
.bact{flex-wrap:wrap}
body.is-dragging [data-drop]{border:2px dashed #C9BFF5 !important;background:#F6F3FF}
body.is-dragging .side::before{content:'여기 폴더 위에 놓으세요 👇';display:block;font-size:12px;color:#6B5BD6;padding:0 12px 8px}
.picklist{max-height:46vh;overflow:auto;margin-top:12px;border:1.5px solid var(--line);border-radius:14px;padding:6px}
.pick{display:block;width:100%;text-align:left;border:0;border-radius:10px;padding:10px 14px;background:transparent}
.pick:hover{background:var(--main-soft)}
.pick.on{background:#F4EDE2}
.lay{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;margin-bottom:10px;border:2px solid var(--line);border-radius:18px;background:#fff}
.lay:hover{border-color:var(--main);background:#FAFAFF}
.pv{flex:0 0 96px;height:66px;border-radius:12px;background:#EAF0FF;padding:7px;display:flex;gap:5px}
.pv i{display:block;background:#fff;border-radius:4px}
.pv-col > div,.pv-wall > div{flex:1;display:flex;flex-direction:column;gap:4px}
.pv-col i{height:12px}
.pv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.laybar{background:#FBF6EE;border-radius:16px;padding:12px;margin:10px 0 4px}
.laybar .pv{flex-basis:70px;width:70px;height:48px;padding:5px}
.pv{overflow:hidden;width:96px}
.freeboard{padding:16px;border-radius:22px;min-height:300px}
.freeboard.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-items:start}
.freeboard.grid .post{margin:0;min-height:140px}
.freeboard.wall{column-width:240px;column-gap:14px}
.freeboard.wall .post{break-inside:avoid}
.hr{height:1.5px;background:var(--line);margin:14px 4px}

/* 메인 헤더 */
.mh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.mh h2{font-size:26px}
.crumb{color:var(--ink2);font-size:13px;margin-bottom:4px}
.crumb span{cursor:pointer}
.crumb span:hover{text-decoration:underline}

/* 카드 그리드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.fcard{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--paper);border:2px dashed var(--line);border-radius:var(--r);cursor:pointer}
.fcard:hover{border-color:#D9CFC0}
.fcard .ico{font-size:24px}
.bcard{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.bcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(120,100,80,.10)}
.bthumb{height:92px;position:relative;display:flex;align-items:flex-end;padding:10px}
.bthumb .mini{display:flex;gap:5px}
.bthumb .mini i{display:block;width:26px;height:20px;border-radius:6px;background:rgba(255,255,255,.75)}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:#fff;color:var(--ink2)}
.badge.open{background:var(--ok-soft);color:#1E8A5F}
.badge.readonly{background:var(--lemon);color:#8A6A00}
.badge.closed{background:#EEE;color:#777}
.badge.pending{background:var(--peach);color:#B4552A}
.bthumb .badge{position:absolute;top:10px;right:10px}
.bbody{padding:12px 14px 12px}
.btitle{font-family:'Jua';font-size:18px;margin-bottom:4px;word-break:keep-all}
.bmeta{font-size:12px;color:var(--ink2);margin-bottom:10px}
.bact{display:flex;gap:6px}
.empty{text-align:center;padding:50px 20px;color:var(--ink2);background:var(--paper);border:2px dashed var(--line);border-radius:var(--r)}
.empty .big{font-size:46px;margin-bottom:8px}

/* 보드 상세 */
.seg{display:inline-flex;background:#F4EDE2;border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.segbtn{display:block;text-align:center;padding:8px 12px;border-radius:9px;cursor:pointer}
.seg input:checked + .segbtn{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);color:#4B57C8}
.info{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.infobox{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px}
.chip{display:inline-block;background:#F4EDE2;border-radius:999px;padding:2px 9px;margin:2px;font-size:12px}
.cols{display:flex;gap:16px;overflow-x:auto;padding:16px;border-radius:22px;align-items:flex-start;min-height:300px}
.col{flex:0 0 270px;background:rgba(255,255,255,.55);border-radius:18px;padding:12px}
.colh{font-family:'Jua';font-size:18px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.post{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 6px rgba(80,60,40,.07)}
.post.hidden{opacity:.5}
.post.pinned{outline:3px solid #FFC94D;outline-offset:-1px}
.badge.pin{background:#FFF0B8;color:#8A6A00}
.post .who{font-size:12px;color:var(--ink2);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.post .txt{white-space:pre-wrap;word-break:break-word;line-height:1.55}
.post .pimg{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin:2px 0 6px;background:#f3eee6}
.post .lnk{display:block;margin-top:6px;font-size:12px;color:#4B57C8;word-break:break-all}
.post .pf{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.post .pf select{width:auto;padding:4px 8px;font-size:12px;border-radius:9px}

/* 표 */
table.t{width:100%;border-collapse:separate;border-spacing:0;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
table.t th,table.t td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-weight:400;color:var(--ink2);font-size:13px;background:#FDF9F3}
table.t tr:last-child td{border-bottom:0}
table.t input{padding:6px 9px;border-radius:9px}

/* 모달 */
.mbg{position:fixed;inset:0;background:rgba(58,53,80,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--paper);border-radius:24px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.modal h3{font-size:22px;margin-bottom:6px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:12px;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--main)}
.secrow{display:flex;gap:6px;margin-bottom:6px}
.menu button{display:block;width:100%;text-align:left;margin-bottom:6px}
.qrbox{text-align:center}
.qrbox #qr{display:inline-block;padding:14px;background:#fff;border-radius:18px;border:1.5px solid var(--line);margin:14px 0}
.qrbox #qr img,.qrbox #qr canvas{display:block}
.qrurl{font-size:13px;color:var(--ink2);word-break:break-all}

/* 로그인 */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth .card{background:var(--paper);border-radius:28px;padding:34px 30px;width:min(400px,100%);box-shadow:0 14px 40px rgba(120,100,80,.12);text-align:center}
.auth .card form{text-align:left}
.auth .bear{font-size:56px}
.tabs{display:flex;background:#F4EDE2;border-radius:14px;padding:4px;margin:18px 0 6px}
.tabs button{flex:1;border:0;background:transparent;border-radius:11px}
.tabs button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.err{background:var(--danger)}
.loading{padding:60px;text-align:center;color:var(--ink2)}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1.5px solid var(--line)}
  .content{padding:18px}
}
@media print{
  body.print-qr > *:not(#modal-root){display:none!important}
  body.print-qr .mbg{position:static;background:none}
  body.print-qr .modal{box-shadow:none;width:100%;max-height:none}
  body.print-qr .mfoot{display:none}
  body.print-qr .qrbox h3{font-size:40px}
  body.print-pin > *:not(#printzone){display:none!important}
  body.print-pin #printzone{display:block!important}
}
#printzone{display:none}
.pincards{display:grid;grid-template-columns:repeat(3,1fr);gap:0;font-family:'Gowun Dodum',sans-serif}
.pincard{border:1.5px dashed #bbb;padding:18px 10px;text-align:center;break-inside:avoid;height:46mm;display:flex;flex-direction:column;justify-content:center;gap:4px}
.pincard .a{font-size:34px}
.pincard .n{font-family:'Jua';font-size:20px}
.pincard .p{font-family:ui-monospace,Menlo,monospace;font-size:28px;letter-spacing:6px;background:#FFF4BF;border-radius:10px;padding:4px 0;margin:4px 16px 0}
.pincard .c{font-size:11px;color:#888}
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<div id="modal-root"></div>
<div id="printzone"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
// =====================================================================
// 우리반 보드 — 교사 화면
// =====================================================================
const CFG = window.CLASSBOARD_CONFIG;
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

const COLORS = {white:'#FFFFFF', sky:'#D6ECFF', mint:'#D3F5E6', lemon:'#FFF4BF', peach:'#FFE0D1', lavender:'#E8DFFF', pink:'#FFDDEA'};
const BGS = [
  'linear-gradient(135deg,#a1c4fd,#c2e9fb)',
  'linear-gradient(135deg,#d4fc79,#96e6a1)',
  'linear-gradient(135deg,#fddb92,#d1fdff)',
  'linear-gradient(135deg,#fbc2eb,#a6c1ee)',
  'linear-gradient(135deg,#ffecd2,#fcb69f)',
  'linear-gradient(135deg,#e0c3fc,#8ec5fc)',
  '#FFF4BF', '#D3F5E6', '#FFE0D1'
];
const LINK_LABEL = {open:'열림', readonly:'보기만', closed:'닫힘'};
const LAYOUT_LABEL = {columns:'칼럼형', wall:'담벼락형', grid:'그리드형', canvas:'캔버스'};

const S = {
  user:null, classes:[], classId:null,
  folders:[], boards:[], students:[], counts:{},
  view:{t:'all'}, closedFolders:new Set(),
  detail:null, dragging:null, channel:null, timer:null
};

// ---------- 도우미 ----------
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const studentUrl = code => new URL('b.html?b=' + code, location.href).href;
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

function nice(m){
  m = String(m || '');
  if (/^[A-Z_]+: /.test(m)) return m.slice(m.indexOf(': ') + 2);
  if (m.includes('Invalid login')) return '이메일이나 비밀번호가 맞지 않아요';
  if (m.includes('already registered')) return '이미 가입된 이메일이에요';
  if (m.includes('Email not confirmed')) return '메일함에서 인증 링크를 먼저 눌러 주세요';
  if (m.includes('Password should be')) return '비밀번호는 6자 이상이어야 해요';
  if (m.includes('duplicate key') && m.includes('students')) return '같은 번호의 학생이 이미 있어요';
  return m;
}
async function q(p){
  const { data, error } = await p;
  if (error){ toast(nice(error.message), true); throw error; }
  return data;
}
let toastTimer;
function toast(msg, err=false){
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 2400);
}
async function copyText(text, okMsg='복사했어요'){
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(e){ await promptBox('아래 주소를 길게 눌러 복사하세요', text); }
}
function parseRoster(text){
  return String(text || '').split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(\d+)\s*(?:번)?[\s.,)\t]*\s*(.+)$/);
    return m ? { number: parseInt(m[1], 10), name: m[2].trim() } : null;
  }).filter(Boolean);
}

// ---------- 사진 ----------
async function shrinkImage(file){
  if (file.type === 'image/gif' && file.size < 4e6) return { blob: file, ext: 'gif', type: 'image/gif' };
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch(e){ src = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(file); }); }
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  const k = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(src, 0, 0, c.width, c.height);
  return { blob: await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85)), ext: 'jpg', type: 'image/jpeg' };
}
async function uploadTeacherImage(file, code){
  const img = await shrinkImage(file);
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())).replace(/[^A-Za-z0-9-]/g, '');
  const path = `${code}/teacher/${id}.${img.ext}`;
  const { error } = await sb.storage.from('post-images').upload(path, img.blob, { contentType: img.type, upsert: false });
  if (error){ toast('사진을 올리지 못했어요: ' + nice(error.message), true); throw error; }
  return sb.storage.from('post-images').getPublicUrl(path).data.publicUrl;
}

// ---------- 모달 ----------
function openModal(html, onMount){
  const root = $('#modal-root');
  root.innerHTML = `<div class="mbg"><div class="modal">${html}</div></div>`;
  const bg = root.firstElementChild;
  bg.addEventListener('mousedown', e => { if (e.target === bg) closeModal(); });
  onMount && onMount(bg.firstElementChild);
  const first = bg.querySelector('input,textarea,select');
  first && setTimeout(() => first.focus(), 30);
}
function closeModal(){ $('#modal-root').innerHTML = ''; document.body.classList.remove('print-qr'); }
function confirmBox(msg, okText='확인', danger=false){
  return new Promise(res => {
    openModal(`<h3>${esc(msg)}</h3><div class="mfoot"><button data-x>취소</button><button class="${danger ? 'danger fill' : 'main'}" data-ok>${esc(okText)}</button></div>`, m => {
      m.querySelector('[data-x]').onclick = () => { closeModal(); res(false); };
      m.querySelector('[data-ok]').onclick = () => { closeModal(); res(true); };
    });
  });
}
function promptBox(title, value=''){
  return new Promise(res => {
    openModal(`<h3>${esc(title)}</h3><form><input name="v" value="${esc(value)}"><div class="mfoot"><button type="button" data-x>취소</button><button class="main">확인</button></div></form>`, m => {
      m.querySelector('[data-x]').onclick = () => { closeModal(); res(null); };
      m.querySelector('form').onsubmit = e => { e.preventDefault(); const v = e.target.v.value.trim(); closeModal(); res(v || null); };
    });
  });
}

// ---------- 로그인 ----------
let booted = false;
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'PASSWORD_RECOVERY') setTimeout(() => changePassword(true), 300);
  const u = session?.user || null;
  if (!booted || (u?.id) !== (S.user?.id)){
    booted = true; S.user = u; S.isAdmin = undefined;
    setTimeout(boot, 0);
  }
});

async function boot(){
  stopLive();
  if (!S.user) return renderAuth('login');
  $('#app').innerHTML = '<div class="loading">불러오는 중…</div>';
  await loadClasses();
}

function renderAuth(mode){
  $('#app').innerHTML = `
  <div class="auth"><div class="card">
    <div class="bear">🧸</div>
    <h1 style="font-size:28px">우리반 보드</h1>
    <div class="muted">선생님 전용 관리 화면</div>
    <div class="tabs">
      <button class="${mode==='login'?'on':''}" data-act="auth-mode" data-id="login">로그인</button>
      <button class="${mode==='signup'?'on':''}" data-act="auth-mode" data-id="signup">처음이에요 (가입)</button>
    </div>
    <form id="authf">

async function loadClasses(){
  if (S.isAdmin === undefined){ const r = await sb.rpc('is_admin'); S.isAdmin = !r.error && r.data === true; }
  S.classes = await q(sb.from('classes').select('*').order('created_at'));
  if (!S.classes.length) return renderOnboarding();
  const saved = store.get('cb_class');
  const active = S.classes.filter(c => !c.archived);
  S.classId = S.classes.some(c => c.id === saved) ? saved : (active[active.length-1] || S.classes[0]).id;
  await loadClassData();
  render();
}

async function loadClassData(){
  const [folders, boards, students] = await Promise.all([
    q(sb.from('folders').select('*').eq('class_id', S.classId).order('sort_order').order('created_at')),
    q(sb.from('boards').select('*').eq('class_id', S.classId).order('created_at', { ascending:false })),
    q(sb.from('students').select('*').eq('class_id', S.classId).order('number'))
  ]);
  S.folders = folders; S.boards = boards; S.students = students; S.counts = {};
  if (boards.length){
    const posts = await q(sb.from('posts').select('board_id,status').in('board_id', boards.map(b => b.id)));
    for (const p of posts){
      const c = S.counts[p.board_id] ||= { all:0, pending:0 };
      c.all++; if (p.status === 'pending') c.pending++;
    }
  }
}
async function refresh(){ await loadClassData(); if (S.view.t === 'board') await loadDetail(); render(); }

const folderById = id => S.folders.find(f => f.id === id);
const boardById = id => S.boards.find(b => b.id === id);
const childFolders = pid => S.folders.filter(f => (f.parent_id || null) === (pid || null));
function folderPath(id){
  const path = []; let f = folderById(id);
  while (f){ path.unshift(f); f = folderById(f.parent_id); }
  return path;
}
function flatFolders(pid=null, depth=0, out=[]){
  for (const f of childFolders(pid)){ out.push({ f, depth }); flatFolders(f.id, depth+1, out); }
  return out;
}
const liveBoards = () => S.boards.filter(b => !b.deleted_at && !b.archived_at);

function navItem(label, t, extra={}){

}
function renderTree(pid=null, depth=0){
  return childFolders(pid).map(f => {
    const kids = childFolders(f.id).length;
    const closed = S.closedFolders.has(f.id);
    const cnt = liveBoards().filter(b => b.folder_id === f.id).length;

    return `<div class="nav ${on?'on':''}" style="padding-left:${12 + depth*16}px" data-act="open-folder" data-id="${f.id}" draggable="true" data-drag="folder:${f.id}" data-drop="folder:${f.id}">

      <div class="btitle">${esc(b.title)}</div>
      <div class="bmeta">${path ? '📁 ' + esc(path) + ' · ' : ''}글 ${c.all}${c.pending ? ` · <span class="badge pending">승인 대기 ${c.pending}</span>` : ''}</div>
      <div class="bact">${actions}</div>

  let v = el.value.trim();
  if (k === 'number'){ v = parseInt(v, 10); if (!v) return toast('번호를 숫자로 넣어 주세요', true); }
  if (k === 'name' && !v) return toast('이름을 비울 수 없어요', true);
  if (k === 'pin'){ if (v && !/^\d{4,6}$/.test(v)) return toast('PIN은 숫자 4~6자리로 넣어 주세요', true); v = v || null; }
  const s = S.students.find(x => x.id === id);
  if (!s || s[k] === v) return;
  await q(sb.from('students').update({ [k]: v }).eq('id', id));
  s[k] = v; toast('저장했어요');
}

async function openBoard(id){
  stopLive();
  S.view = { t:'board', id }; S.detail = null;
  render(); await loadDetail(); render();
}
async function loadDetail(){
  const id = S.view.id;
  if (boardById(id)?.layout === 'canvas'){
    const { data, error } = await sb.from('canvas_groups').select('*').eq('board_id', id).order('sort_order').order('created_at');
    if (S.view.t === 'board' && S.view.id === id) S.detail = { canvas: true, groups: data || [], err: error ? error.message : null };
    return;
  }
  const [sections, posts, missing] = await Promise.all([
    q(sb.from('sections').select('*').eq('board_id', id).order('sort_order')),
    q(sb.from('posts').select('*, students!posts_student_id_fkey(number,name), comments(count), likes(count)').eq('board_id', id).order('sort_order').order('created_at')),
    q(sb.rpc('missing_students', { p_board_id: id }))
  ]);
  if (S.view.t === 'board' && S.view.id === id) S.detail = { sections, posts, missing };
}
function renderDetail(){
  const b = boardById(S.view.id);
  if (!b){ S.view = { t:'all' }; return renderMain(); }
  const d = S.detail;
  const path = folderPath(b.folder_id);
  const head = `
    <div class="crumb"><span data-act="go" data-id="all">모든 보드</span>${path.map(p => ` › <span data-act="open-folder" data-id="${p.id}">${esc(p.name)}</span>`).join('')}</div>
    <div class="mh"><h2>${esc(b.title)}</h2>
      <div class="seg">${['open','readonly','closed'].map(s => `<button class="${b.link_status===s?'on':''}" data-act="link-status" data-id="${s}">${{open:'✏️ 쓰기 가능', readonly:'👀 보기만', closed:'🔒 닫기'}[s]}</button>`).join('')}</div>
      <span class="sp"></span>
      <a href="${esc(studentUrl(b.share_code))}" target="_blank" rel="noopener"><button class="sm">↗ 학생 화면</button></a>
      <button class="sm" data-act="copy-link" data-id="${b.id}">🔗 링크</button>
      <button class="sm" data-act="qr" data-id="${b.id}">📱 QR</button>
      ${b.layout === 'canvas' ? '' : '<button class="sm" data-act="teacher-post">✏️ 선생님 글</button>'}
      <button class="sm" data-act="board-settings" data-id="${b.id}">⚙️ 설정</button>
    </div>`;
  if (!d) return head + '<div class="loading">불러오는 중…</div>';
  if (d.canvas) return head + renderCanvasGroups(b, d);

  d.posts.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  const pending = d.posts.filter(p => p.status === 'pending');
  const info = `
    <div class="info">
      <div class="infobox">📝 글 <b>${d.posts.length}</b>개${pending.length ? ` · <span class="badge pending">승인 대기 ${pending.length}</span> <button class="sm" data-act="approve-all">모두 승인</button>` : ''}</div>
      <div class="infobox">🙋 아직 안 쓴 학생 ${d.missing.length ? d.missing.map(m => `<span class="chip">${m.number} ${esc(m.name)}</span>`).join('') : '<b>없음 🎉</b>'}</div>
      <div class="infobox muted">${LAYOUT_LABEL[b.layout]} · ${b.require_approval ? '승인 후 공개' : '바로 공개'} · 이름 ${b.show_names ? '보임' : '숨김'} ${b.layout === 'columns' ? ` · 학생 이동 ${b.allow_student_move ? '가능' : '불가'}` : ''}</div>
    </div>`;
  const cols = [...d.sections];
  if (d.posts.some(p => !p.section_id || !cols.some(c => c.id === p.section_id))) cols.push({ id:null, title:'칼럼 없음' });
  const secOpts = sel => d.sections.map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.title)}</option>`).join('');
  const postHtml = p => {
    const who = p.student_id ? (p.students ? `${p.students.number}번 ${esc(p.students.name)}` : '알 수 없음') : '👩‍🏫 선생님';
    return `<div class="post ${p.status === 'hidden' ? 'hidden' : ''} ${p.pinned ? 'pinned' : ''}" style="background:${COLORS[p.color] || '#fff'}">
      <div class="who">${p.pinned ? '<span class="badge pin">📌 고정</span>' : ''}${who}${p.status === 'pending' ? '<span class="badge pending">승인 대기</span>' : ''}${p.status === 'hidden' ? '<span class="badge closed">숨김</span>' : ''}</div>
      ${p.image_url ? `<a href="${esc(p.image_url)}" target="_blank" rel="noopener"><img class="pimg" src="${esc(p.image_url)}" loading="lazy" alt="첨부 사진"></a>` : ''}
      ${p.content ? `<div class="txt">${esc(p.content)}</div>` : ''}
      ${p.link_url ? `<a class="lnk" href="${esc(p.link_url)}" target="_blank" rel="noopener">${esc(p.link_url)}</a>` : ''}
      <div class="pf">❤️ ${p.likes?.[0]?.count || 0} 💬 ${p.comments?.[0]?.count || 0}<span class="sp"></span>
        ${p.status === 'pending' ? `<button class="sm main" data-act="post-status" data-id="${p.id}" data-s="approved">승인</button>` : ''}
        ${p.status === 'hidden' ? `<button class="sm" data-act="post-status" data-id="${p.id}" data-s="approved">보이기</button>` : `<button class="sm ghost" data-act="post-status" data-id="${p.id}" data-s="hidden">숨기기</button>`}
        <button class="sm ghost" data-act="post-pin" data-id="${p.id}" title="${p.pinned ? '고정 풀기' : '맨 위에 고정'}">${p.pinned ? '📌 풀기' : '📌 고정'}</button>
        <button class="sm ghost danger" data-act="post-delete" data-id="${p.id}">삭제</button>
      </div>
      ${b.layout === 'columns' && d.sections.length > 1 ? `<div class="pf">칼럼 <select data-move-post="${p.id}">${secOpts(p.section_id)}</select></div>` : ''}
    </div>`;
  };
  const free = b.layout !== 'columns';
  const board = free
    ? `<div class="freeboard ${b.layout}" style="background:${esc(b.background || BGS[0])}">${d.posts.map(postHtml).join('') || '<div class="muted" style="padding:10px">아직 글이 없어요</div>'}</div>`
    : `<div class="cols" style="background:${esc(b.background || BGS[0])}">
    ${cols.map(c => {
      const list = d.posts.filter(p => c.id ? p.section_id === c.id : (!p.section_id || !d.sections.some(s => s.id === p.section_id)));
      return `<div class="col"><div class="colh"><span>${esc(c.title)}</span><span class="muted" style="font-family:'Gowun Dodum';font-size:13px">${list.length}</span></div>${list.map(postHtml).join('') || '<div class="muted" style="font-size:13px;padding:6px">아직 글이 없어요</div>'}</div>`;
    }).join('') || '<div class="muted">칼럼이 없어요. ⚙️ 설정에서 칼럼을 추가하세요.</div>'}
  </div>`;
  return head + info + board;
}

const ANI = ['🐶','🐱','🐰','🐻','🐼','🦊','🐨','🐯','🦁','🐸','🐷','🐵','🐥','🐧','🦄','🐹','🐮','🐙','🦋','🐞','🐳','🦔','🐿️','🦉','🐢','🐬','🐝','🦕','🐲','🦒','🐌','🦀','🐠','🦩','🐣'];

function renderCanvasPersonal(b, d){

function renderCanvasGroups(b, d){

}

// 실시간: 학생 화면과 같은 채널을 들음
function startLive(){
  const b = boardById(S.view.id);
  if (!b || S.channel) return;
  S.channel = sb.channel('board:' + b.share_code)
    .on('broadcast', { event:'changed' }, () => softReload())
    .subscribe();
  S.timer = setInterval(softReload, 15000);
}
function stopLive(){
  if (S.channel){ sb.removeChannel(S.channel); S.channel = null; }
  if (S.timer){ clearInterval(S.timer); S.timer = null; }
}
let reloading = false;
async function softReload(){
  if (reloading || S.view.t !== 'board' || $('#modal-root').innerHTML) return;
  reloading = true;
  try { await loadDetail(); const y = scrollY; render(); scrollTo(0, y); } finally { reloading = false; }
}
function ping(){ S.channel && S.channel.send({ type:'broadcast', event:'changed', payload:{} }); }

function secRow(s){
  return `<div class="secrow" data-sid="${s.id || ''}"><input value="${esc(s.title)}" placeholder="칼럼 이름"><button type="button" class="sm ghost" data-act="sec-up">↑</button><button type="button" class="sm ghost" data-act="sec-down">↓</button><button type="button" class="sm ghost danger" data-act="sec-del">✕</button></div>`;
}
// 칼럼형이 아니면 null (칼럼은 건드리지 않음)
function readSections(m){
  if (m.querySelector('[name=layout]').value !== 'columns') return null;
  return [...m.querySelectorAll('#secList .secrow')].map((r, i) => ({ id: r.dataset.sid || null, title: r.querySelector('input').value.trim(), sort_order: i + 1 })).filter(s => s.title);
}
function readBoardForm(f){
  const extra = f.layout.value === 'canvas' && f.cmode ? { canvas_mode: f.cmode.value } : {};
  return { ...extra,
    title: f.title.value.trim(), description: f.desc.value.trim() || null, layout: f.layout.value,
    background: f.bg.value, require_approval: f.appr.checked, show_names: f.names.checked, allow_student_move: f.move.checked
  };
}
// 새 보드: 1단계 모양 고르기 → 2단계 모양에 맞는 설정
function newBoard(folderId){
  if (folderId) S.view = { t:'folder', id: folderId };
  openModal(`<h3>✨ 어떤 모양의 보드를 만들까요?</h3>
    <div class="muted" style="font-size:13px">나중에 설정에서 바꿀 수도 있어요</div>
    <div style="margin-top:14px">${Object.keys(LAYOUTS).map(k => layoutCard(k, 'choose-layout', false)).join('')}</div>
    <div class="mfoot"><button type="button" onclick="closeModal()">취소</button></div>`);
}
function newBoardStep2(layout){
  openModal(`<h3>✨ 새 보드</h3><form>${boardFormHtml(null, null, layout)}
    <div class="mfoot"><button type="button" onclick="closeModal()">취소</button><button class="main">만들기</button></div></form>`, m => {
    m.querySelector('form').onsubmit = async e => {
      e.preventDefault();
      const f = e.target;
      let secs = readSections(m);
      if (secs && !secs.length) return toast('칼럼을 하나 이상 만들어 주세요', true);
      if (!secs) secs = [{ title:'전체', sort_order:1 }];
      f.querySelector('.main').disabled = true;
      try {
        let folderId = f.folder.value || null;
        if (folderId === '__new'){
          const name = f.newfolder.value.trim();
          if (!name){ f.querySelector('.main').disabled = false; return toast('새 폴더 이름을 넣어 주세요', true); }
          const [nf] = await q(sb.from('folders').insert({ name, class_id: S.classId, parent_id: S.view.t === 'folder' ? S.view.id : null, sort_order: Date.now() / 1e12 }).select());
          folderId = nf.id;
        }
        const [b] = await q(sb.from('boards').insert({ ...readBoardForm(f), class_id: S.classId, folder_id: folderId }).select());
        await q(sb.from('sections').insert(secs.map(s => ({ board_id: b.id, title: s.title, sort_order: s.sort_order }))));
        if (b.layout === 'canvas' && (b.canvas_mode || 'group') === 'group'){
          const n = Math.max(1, Math.min(12, parseInt(f.groups.value, 10) || 6));
          await q(sb.from('canvas_groups').insert(Array.from({ length: n }, (_, k) => ({ board_id: b.id, name: `${k + 1}모둠`, sort_order: k + 1 }))));
        }
        closeModal(); await loadClassData(); toast('보드를 만들었어요'); openBoard(b.id);
      } catch(err){ f.querySelector('.main').disabled = false; }
    };
  });
}
async function boardSettings(id){
  const b = boardById(id);
  const sections = await q(sb.from('sections').select('*').eq('board_id', id).order('sort_order'));
  openModal(`<h3>⚙️ 보드 설정</h3><form>${boardFormHtml(b, sections, b.layout)}
    <label class="f">학생 링크</label>
    <div class="row"><span class="muted" style="font-size:13px">코드 <b>${esc(b.share_code)}</b></span><button type="button" class="sm" data-act="regen" data-id="${b.id}">♻️ 링크 새로 만들기</button></div>
    <div class="mfoot"><button type="button" onclick="closeModal()">취소</button><button class="main">저장</button></div></form>`, m => {
    m.querySelector('form').onsubmit = async e => {
      e.preventDefault();
      const f = e.target, secs = readSections(m);
      if (secs && !secs.length) return toast('칼럼을 하나 이상 남겨 주세요', true);
      f.querySelector('.main').disabled = true;
      try {
        await q(sb.from('boards').update(readBoardForm(f)).eq('id', id));
        if (secs){
          const keep = new Set(secs.filter(s => s.id).map(s => s.id));
          const gone = sections.filter(s => !keep.has(s.id)).map(s => s.id);
          if (gone.length) await q(sb.from('sections').delete().in('id', gone));
          for (const s of secs){
            if (s.id) await q(sb.from('sections').update({ title: s.title, sort_order: s.sort_order }).eq('id', s.id));
            else await q(sb.from('sections').insert({ board_id: id, title: s.title, sort_order: s.sort_order }));
          }
        } else if (!sections.length){
          await q(sb.from('sections').insert({ board_id: id, title:'전체', sort_order:1 }));
        }
        closeModal(); toast('저장했어요'); ping(); await refresh();
      } catch(err){ f.querySelector('.main').disabled = false; }
    };
  });
}

// 폴더 고르기: 목록에서 눌러 고르고, 없으면 바로 새로 만들기
function pickFolder(title, current, exclude){
  return new Promise(res => {
    const list = flatFolders().filter(({ f }) => !exclude || !isInside(f.id, exclude));
    const item = (id, label, depth=0) => `<button type="button" class="pick ${id === (current || '') ? 'on' : ''}" data-v="${id}" style="padding-left:${14 + depth*18}px">${label}${id === (current || '') ? ' <span class="muted" style="font-size:12px">(지금 여기)</span>' : ''}</button>`;
    openModal(`<h3>${esc(title)}</h3>
      <div class="picklist">
        ${item('', '📄 폴더 밖 (맨 위)')}
        ${list.map(({ f, depth }) => item(f.id, `📁 ${esc(f.name)}`, depth)).join('')}
      </div>
      <form class="row" style="margin-top:12px;flex-wrap:nowrap"><input name="n" placeholder="새 폴더 이름 (예: 국어 3단원)"><button class="main" style="white-space:nowrap">＋ 만들어서 옮기기</button></form>
      <div class="mfoot"><button type="button" data-x>취소</button></div>`, m => {
      m.querySelector('[data-x]').onclick = () => { closeModal(); res(undefined); };
      m.querySelectorAll('.pick').forEach(b => b.onclick = () => { closeModal(); res(b.dataset.v || null); });
      m.querySelector('form').onsubmit = async e => {
        e.preventDefault();
        const name = e.target.n.value.trim();
        if (!name) return toast('새 폴더 이름을 넣어 주세요', true);
        const [f] = await q(sb.from('folders').insert({ name, class_id: S.classId, parent_id: null, sort_order: Date.now() / 1e12 }).select());
        S.folders.push(f); closeModal(); res(f.id);
      };
    });
  });
}
function isInside(fid, ancestor){ let f = folderById(fid); while (f){ if (f.id === ancestor) return true; f = folderById(f.parent_id); } return false; }

async function moveBoard(bid, folderId){
  await q(sb.from('boards').update({ folder_id: folderId }).eq('id', bid));
  const f = folderById(folderId); toast(f ? `📁 ${f.name}(으)로 옮겼어요` : '폴더 밖으로 옮겼어요');
  await refresh();
}
async function moveFolder(fid, parentId){
  if (fid === parentId) return;
  if (parentId && isInside(parentId, fid)) return toast('폴더를 자기 안으로 옮길 수 없어요', true);
  await q(sb.from('folders').update({ parent_id: parentId }).eq('id', fid));
  toast('폴더를 옮겼어요'); await refresh();
}

// ---------- 드래그 앤 드롭 ----------
document.addEventListener('dragstart', e => {
  const el = e.target.closest && e.target.closest('[data-drag]');
  if (!el) return;
  S.dragging = el.dataset.drag;
  e.dataTransfer.setData('text/plain', S.dragging); e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => document.body.classList.add('is-dragging'), 0);
});
document.addEventListener('dragover', e => {
  const t = e.target.closest && e.target.closest('[data-drop]');
  if (!t || !S.dragging) return;
  if (t.dataset.drop === S.dragging) return;
  e.preventDefault();
  document.querySelectorAll('.dropping').forEach(x => x !== t && x.classList.remove('dropping'));
  t.classList.add('dropping');
});
document.addEventListener('dragleave', e => {
  const t = e.target.closest && e.target.closest('[data-drop]');
  if (t && !t.contains(e.relatedTarget)) t.classList.remove('dropping');
});
document.addEventListener('drop', async e => {
  const t = e.target.closest && e.target.closest('[data-drop]');
  document.querySelectorAll('.dropping').forEach(x => x.classList.remove('dropping'));
  document.body.classList.remove('is-dragging');
  const src = S.dragging; S.dragging = null;
  if (!t || !src) return;
  e.preventDefault();
  const dst = t.dataset.drop, target = dst === 'root' ? null : dst.split(':')[1];
  const [kind, id] = src.split(':');
  try {
    if (kind === 'board'){ if (boardById(id)?.folder_id !== target) await moveBoard(id, target); }
    else if (kind === 'folder' && id !== target){ await moveFolder(id, target); }
  } catch(err){}
});
document.addEventListener('dragend', () => { S.dragging = null; document.body.classList.remove('is-dragging'); document.querySelectorAll('.dropping').forEach(x => x.classList.remove('dropping')); });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault(); e.stopPropagation();
  Promise.resolve(fn(el.dataset.id, el, e)).catch(err => console.error(err));
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.stu) saveStudentField(t).catch(() => {});
  else if (t.dataset.movePost){
    q(sb.from('posts').update({ section_id: t.value }).eq('id', t.dataset.movePost)).then(() => { ping(); refresh(); }).catch(() => {});
  } else if (t.id === 'stuJump') openPortfolio(t.value);
  else if (t.dataset.cmode !== undefined){
    const m = t.closest('.modal'), ind = t.value === 'individual';
    m.querySelectorAll('.cm-group').forEach(x => x.hidden = ind);
    m.querySelector('.cm-help').textContent = ind ? '학생마다 자기 캔버스가 하나씩 생겨요. 자기 것만 보고 고쳐요.' : '모둠원 4~5명이 한 캔버스를 함께 만들어요.';
  }
  else if (t.dataset.newfolder !== undefined){
    const inp = t.form.querySelector('[name=newfolder]');
    inp.hidden = t.value !== '__new'; if (!inp.hidden) inp.focus();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });
</script>
</body>
