<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFF9F0">
<meta name="mobile-web-app-capable" content="yes">
<title>우리반 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
:root{
  color-scheme: light only;
  --cream:#FFF9F0; --ink:#3A3550; --ink2:#7A7590; --line:#EEE6DA;
  --main:#7C8CFF; --main-soft:#E8EBFF; --danger:#F06A6A; --heart:#FF6B8B;
  --white:#FFFFFF; --sky:#D6ECFF; --mint:#D3F5E6; --lemon:#FFF4BF; --peach:#FFE0D1; --lavender:#E8DFFF; --pink:#FFDDEA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:17px;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:#fff;border-radius:16px;min-height:48px;padding:10px 18px;transition:transform .12s}
button:active{transform:scale(.94)}
button.main{background:var(--main);color:#fff}
button.soft{background:#F4EDE2}
button.icon{min-height:44px;min-width:44px;padding:8px 10px;background:transparent;border-radius:12px}
input,textarea{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--main)}
textarea{resize:none;min-height:140px;line-height:1.6}

/* 공통 화면 */
.center{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.bigemoji{font-size:72px;line-height:1;margin-bottom:12px}
.muted{color:var(--ink2)}

/* 번호 고르기 */
.pick-wrap{max-width:900px;margin:0 auto;padding:28px 20px 40px}
.pick-title{text-align:center;margin:10px 0 24px}
.pick-title h1{font-size:30px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.stu{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border-radius:22px;background:#fff;box-shadow:0 3px 0 #EFE5D6;min-height:130px}
.stu .ani{font-size:44px;line-height:1}
.stu .num{font-family:'Jua';font-size:20px}
.stu .nm{font-size:15px;color:var(--ink2)}
.stu:active{box-shadow:none;transform:translateY(3px)}

/* 상단바 */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,249,240,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.top h1{font-size:24px;line-height:1.2;word-break:keep-all}
.top .desc{font-size:14px;color:var(--ink2);margin-top:2px}
.me{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 8px 6px 12px;white-space:nowrap}
.me .ani{font-size:26px}
.me button{min-height:36px;padding:6px 12px;font-size:14px;background:#F4EDE2;border-radius:999px}
.notice{margin:12px 18px 0;padding:12px 16px;border-radius:16px;background:var(--lemon);font-size:15px}

/* 보드 */
.board{min-height:calc(100dvh - 80px);padding:18px 18px 120px}
.cols{display:flex;gap:16px;overflow-x:auto;align-items:flex-start;scroll-snap-type:x proximity;padding-bottom:20px;-webkit-overflow-scrolling:touch}
.col{flex:0 0 300px;scroll-snap-align:start;background:rgba(255,255,255,.55);border-radius:24px;padding:14px}
.colh{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 12px}
.colh h2{font-size:21px}
.colh .n{font-size:14px;color:var(--ink2);background:#fff;border-radius:999px;padding:2px 10px}
.addhere{width:100%;margin-bottom:12px;background:rgba(255,255,255,.75);border:2px dashed rgba(124,140,255,.45);color:#5462D8;font-family:'Jua';font-size:17px}
.gridb{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;align-items:start}
.wallb{column-width:250px;column-gap:16px}
.wallb .post{break-inside:avoid}
.gridb .post{margin:0;min-height:150px}

/* 카드 */
.post{background:#fff;border-radius:20px;padding:14px 14px 10px;margin-bottom:14px;box-shadow:0 4px 0 rgba(120,100,80,.08),0 2px 10px rgba(120,100,80,.06);position:relative}
.post.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.post .who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin-bottom:8px}
.post .who .ani{font-size:24px}
.post .who b{font-weight:400;color:var(--ink)}
.post .txt{white-space:pre-wrap;word-break:break-word;line-height:1.6;font-size:17px}
.post .lnk{display:flex;align-items:center;gap:6px;margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.7);font-size:14px;color:#4B57C8;text-decoration:none;word-break:break-all}
.post .pimg{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin:4px 0 6px;background:#f3eee6;cursor:zoom-in}
.photo-pick{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.photo-pick .pv{position:relative}
.photo-pick .pv img{display:block;height:110px;max-width:220px;object-fit:cover;border-radius:14px}
.photo-pick .pv button{position:absolute;top:-10px;right:-10px;min-height:36px;width:36px;padding:0;border-radius:50%;background:var(--ink);color:#fff;font-size:16px}
.zoomimg{display:block;max-width:100%;max-height:75vh;margin:0 auto;border-radius:16px}
.post .pend{display:inline-block;font-size:13px;background:var(--peach);color:#B4552A;border-radius:999px;padding:3px 10px;margin-bottom:8px}
.pfoot{display:flex;align-items:center;gap:2px;margin-top:8px}
.pfoot .sp{flex:1}
.heart{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--ink2)}
.heart .h{font-size:22px;display:inline-block}
.heart.on{color:var(--heart)}
.heart.boom .h{animation:boom .5s ease}
@keyframes boom{0%{transform:scale(1)}30%{transform:scale(1.6) rotate(-10deg)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.cbtn{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--ink2)}

/* 쓰기 버튼 */
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:20;background:var(--main);color:#fff;font-family:'Jua';font-size:22px;padding:16px 26px;border-radius:999px;box-shadow:0 8px 20px rgba(124,140,255,.45);min-height:64px}

/* 시트(모달) */
.sheet-bg{position:fixed;inset:0;background:rgba(58,53,80,.35);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.sheet{background:#fff;border-radius:28px;padding:22px;width:min(560px,100%);box-shadow:0 20px 50px rgba(0,0,0,.2);animation:up .25s ease}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:24px;margin-bottom:12px}
.sfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.sfoot button{min-width:96px}
.colors{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.cdot{width:48px;height:48px;min-height:48px;padding:0;border-radius:50%;border:3px solid #EEE}
.cdot.on{border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{min-height:42px;padding:8px 16px;border-radius:999px;background:#F4EDE2}
.chip.on{background:var(--main);color:#fff}
.lbl{font-size:14px;color:var(--ink2);margin:14px 0 8px}
.menu button{display:block;width:100%;text-align:left;margin-bottom:8px;background:#F8F3EC}
.cmt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1.5px solid var(--line)}
.cmt .ani{font-size:24px}
.cmt .ct{flex:1;white-space:pre-wrap;word-break:break-word}
.cmt .cw{font-size:13px;color:var(--ink2)}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pin button{font-family:'Jua';font-size:26px;min-height:64px;background:#F4EDE2}
.pindots{display:flex;gap:12px;justify-content:center;margin:8px 0}
.pindots i{width:18px;height:18px;border-radius:50%;background:#EEE6DA}
.pindots i.on{background:var(--main)}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:18px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;font-size:16px;text-align:center;max-width:90vw}
.toast.show{opacity:1}
.toast.err{background:var(--danger)}

@media (max-width:600px){
  .top{flex-wrap:wrap}
  .col{flex-basis:84vw}
  .fab{right:16px;bottom:16px}
}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="bigemoji">🧸</div><div class="muted">보드를 불러오는 중…</div></div></div>
<div id="sheet"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// =====================================================================
// 우리반 보드 — 학생 화면 (로그인 없이 링크 + 번호로 입장)
// =====================================================================
const CFG = window.CLASSBOARD_CONFIG;
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth: { persistSession:false, autoRefreshToken:false } });
const CODE = new URLSearchParams(location.search).get('b') || '';

const COLORS = { white:'#FFFFFF', sky:'#D6ECFF', mint:'#D3F5E6', lemon:'#FFF4BF', peach:'#FFE0D1', lavender:'#E8DFFF', pink:'#FFDDEA' };
const ANIMALS = ['🐶','🐱','🐰','🐻','🐼','🦊','🐨','🐯','🦁','🐸','🐷','🐵','🐥','🐧','🦄','🐹','🐮','🐙','🦋','🐞','🐳','🦔','🐿️','🦉','🐢','🐬','🐝','🦕','🐲','🦒','🐌','🦀','🐠','🦩','🐣'];
const ani = n => n ? ANIMALS[(n - 1) % ANIMALS.length] : '🙂';

const S = { board:null, sections:[], students:[], posts:[], me:null, token:null, seen:new Set(), first:true, channel:null, lastColor:'lemon' };

// ---------- 도우미 ----------
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const KEY = 'cb_me_' + CODE;
let toastTimer;
function toast(msg, err=false){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 2300);
}
function errCode(e){ const m = String(e?.message || ''); const c = m.match(/^([A-Z_]+):/); return c ? c[1] : null; }
function errMsg(e){ const m = String(e?.message || ''); return /^[A-Z_]+: /.test(m) ? m.slice(m.indexOf(': ') + 2) : '잠깐 문제가 생겼어요. 다시 해 볼까요?'; }

// 모든 서버 요청은 여기로: 공통 오류 처리
async function call(fn, args){
  const { data, error } = await sb.rpc(fn, { p_code: CODE, ...args });
  if (error){
    const c = errCode(error);
    if (c === 'BOARD_CLOSED'){ showClosed(); throw error; }
    if (c === 'NEED_JOIN'){ logout(true); throw error; }
    toast(errMsg(error), true); throw error;
  }
  return data;
}
function safeUrl(u){ try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch(e){ return null; } }
async function sha256hex(t){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
// 패드 사진은 커서 1600px · JPEG로 줄여서 올림 (보통 300KB 안팎)
async function shrinkImage(file){
  if (file.type === 'image/gif' && file.size < 4e6) return { blob: file, ext: 'gif', type: 'image/gif' };
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch(e){
    src = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(file); });
  }
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  const k = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.82));
  return { blob, ext: 'jpg', type: 'image/jpeg' };
}
async function uploadImage(file){
  const img = await shrinkImage(file);
  if (img.blob.size > 5 * 1024 * 1024) throw new Error('BIG: 사진이 너무 커요');
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^A-Za-z0-9-]/g, '');
  const path = `${CODE}/${await sha256hex(S.token)}/${id}.${img.ext}`;
  const { error } = await sb.storage.from('post-images').upload(path, img.blob, { contentType: img.type, upsert: false });
  if (error) throw error;
  return sb.storage.from('post-images').getPublicUrl(path).data.publicUrl;
}
function authorNum(a){ const m = String(a || '').match(/^(\d+)번/); return m ? parseInt(m[1], 10) : null; }

// ---------- 시작 ----------
async function start(){
  if (!CODE) return showClosed('주소가 올바르지 않아요', '선생님이 준 링크나 QR로 다시 들어와 주세요.');
  try {
    const data = await call('get_board', {});
    S.board = data.board; S.sections = data.sections; S.students = data.students;
    document.title = S.board.title + ' · 우리반 보드';
  } catch(e){ return; }
  const saved = store.get(KEY);
  if (saved?.token && S.students.some(s => s.id === saved.me?.id)){ S.me = saved.me; S.token = saved.token; }
  if (!S.me) return showPicker();
  await enterBoard();
}

function showClosed(title='지금은 닫힌 보드예요', sub='선생님이 다시 열어 주시면 들어올 수 있어요.'){
  stopLive(); closeSheet();
  $('#app').innerHTML = `<div class="center"><div class="bigemoji">🔒</div><h1 style="font-size:28px">${esc(title)}</h1><p class="muted">${esc(sub)}</p><button class="soft" onclick="location.reload()">🔄 다시 확인하기</button></div>`;
}

// ---------- 번호 고르기 ----------
function showPicker(){
  stopLive();
  $('#app').innerHTML = `
  <div class="pick-wrap">
    <div class="pick-title"><div class="bigemoji">🧸</div><h1>${esc(S.board.title)}</h1><p class="muted" style="font-size:19px">나는 몇 번일까? 내 번호를 눌러 줘!</p></div>
    <div class="pick-grid">${S.students.map(s => `
      <button class="stu" data-act="pick" data-id="${s.id}"><span class="ani">${ani(s.number)}</span><span class="num">${s.number}번</span><span class="nm">${esc(s.name)}</span></button>`).join('')}
    </div>
    ${S.students.length ? '' : '<p class="muted" style="text-align:center">아직 학생 명단이 없어요. 선생님께 말씀드려 주세요.</p>'}
  </div>`;
}
async function join(stu, pin=null){
  try {
    const token = await call('student_join', { p_student_id: stu.id, p_pin: pin });
    S.me = { id: stu.id, number: stu.number, name: stu.name }; S.token = token;
    store.set(KEY, { me: S.me, token });
    closeSheet(); toast(`${ani(stu.number)} 반가워, ${stu.name}!`);
    await enterBoard();
  } catch(e){
    if (errCode(e) === 'WRONG_PIN') pinPad(stu, true);
  }
}
function pinPad(stu, wrong=false){
  let pin = '';
  openSheet(`<div style="text-align:center"><div class="bigemoji" style="font-size:56px">${ani(stu.number)}</div>
    <h3>${stu.number}번 ${esc(stu.name)}</h3><div class="muted">${wrong ? '앗, 비밀번호가 달라요. 다시 눌러 볼까?' : '내 비밀번호를 눌러 줘'}</div>
    <div class="pindots" id="dots"></div>
    <div class="pin">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button data-n="back">⌫</button><button data-n="0">0</button><button data-n="ok" class="main">확인</button></div>
    <div class="sfoot" style="justify-content:center"><button class="soft" data-close>다른 번호 고르기</button></div></div>`, sh => {
    const dots = () => sh.querySelector('#dots').innerHTML = Array.from({ length: Math.max(4, pin.length) }, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join('');
    dots();
    sh.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
      const n = b.dataset.n;
      if (n === 'back') pin = pin.slice(0, -1);
      else if (n === 'ok'){ if (pin.length >= 4) join(stu, pin); return; }
      else if (pin.length < 6) pin += n;
      dots();
    });
  });
}
function logout(expired=false){
  store.del(KEY); S.me = null; S.token = null;
  if (expired) toast('다시 내 번호를 골라 줘', true);
  showPicker();
}

// ---------- 보드 ----------
async function enterBoard(){
  await loadPosts();
  render();
  startLive();
}
async function loadPosts(){
  const data = await call('list_posts', { p_token: S.token });
  S.posts = data || [];
}
async function reloadBoard(){
  try {
    const data = await call('get_board', {});
    S.board = data.board; S.sections = data.sections; S.students = data.students;
    if (!S.students.some(s => s.id === S.me?.id)) return logout(true);
    await loadPosts(); render();
  } catch(e){}
}

function render(){
  const b = S.board, open = b.link_status === 'open';
  // 스크롤 위치 기억 (다시 그려도 제자리)
  const colsEl = $('.cols'), sx = colsEl ? colsEl.scrollLeft : 0, sy = scrollY;
  const fresh = new Set();
  for (const p of S.posts){ if (!S.first && !S.seen.has(p.id)) fresh.add(p.id); S.seen.add(p.id); }
  S.first = false;

  let body;
  if (b.layout === 'columns'){
    const cols = [...S.sections];
    const orphan = S.posts.filter(p => !cols.some(c => c.id === p.section_id));
    if (orphan.length) cols.push({ id:null, title:'기타' });
    body = `<div class="cols">${cols.map(c => {
      const list = c.id ? S.posts.filter(p => p.section_id === c.id) : orphan;
      return `<div class="col">
        <div class="colh"><h2>${esc(c.title)}</h2><span class="n">${list.length}</span></div>
        ${open && c.id ? `<button class="addhere" data-act="write" data-id="${c.id}">＋ 여기에 쓰기</button>` : ''}
        ${list.map(p => postHtml(p, fresh)).join('')}
      </div>`;
    }).join('')}</div>`;
  } else {
    const cls = b.layout === 'grid' ? 'gridb' : 'wallb';
    body = S.posts.length ? `<div class="${cls}">${S.posts.map(p => postHtml(p, fresh)).join('')}</div>`
      : `<div class="center" style="min-height:40vh"><div class="bigemoji">📝</div><div class="jua" style="font-size:22px">첫 번째로 생각을 붙여 볼까?</div></div>`;
  }

  const notice = b.link_status === 'readonly' ? '<div class="notice">👀 지금은 <b>보기만</b> 할 수 있어요. 친구들 글을 읽어 보세요!</div>'
    : (b.require_approval ? '<div class="notice" style="background:#EAF6FF">⏳ 내가 쓴 글은 선생님이 확인한 뒤에 친구들에게 보여요.</div>' : '');

  $('#app').innerHTML = `
    <header class="top">
      <div style="flex:1;min-width:0"><h1>${esc(b.title)}</h1>${b.description ? `<div class="desc">${esc(b.description)}</div>` : ''}</div>
      <div class="me"><span class="ani">${ani(S.me.number)}</span><span>${S.me.number}번 ${esc(S.me.name)}</span><button data-act="logout">나가기</button></div>
    </header>
    ${notice}
    <main class="board" style="background:${esc(b.background || '#FFF9F0')}">${body}</main>
    ${open ? '<button class="fab" data-act="write">✏️ 쓰기</button>' : ''}`;
  const nc = $('.cols'); if (nc) nc.scrollLeft = sx;
  scrollTo(0, sy);
}

function postHtml(p, fresh){
  const n = p.is_mine ? S.me.number : authorNum(p.author);
  const who = p.is_teacher ? '👩‍🏫' : ani(n);
  const name = p.is_teacher ? '선생님' : (p.is_mine ? '나' : (p.author || '친구'));
  const url = safeUrl(p.link_url);
  const canEdit = p.is_mine && S.board.link_status === 'open';
  return `<div class="post ${fresh.has(p.id) ? 'pop' : ''}" style="background:${COLORS[p.color] || '#fff'}" data-pid="${p.id}">
    ${p.status === 'pending' ? '<div class="pend">⏳ 선생님 확인 중</div>' : ''}
    <div class="who"><span class="ani">${who}</span><b>${esc(name)}</b></div>
    ${p.image_url ? `<img class="pimg" src="${esc(p.image_url)}" loading="lazy" alt="첨부 사진" data-act="zoom" data-id="${esc(p.image_url)}">` : ''}
    ${p.content ? `<div class="txt">${esc(p.content)}</div>` : ''}
    ${url ? `<a class="lnk" href="${esc(url)}" target="_blank" rel="noopener">🔗 ${esc(new URL(url).hostname)}</a>` : ''}
    <div class="pfoot">
      <button class="icon heart ${p.liked ? 'on' : ''}" data-act="like" data-id="${p.id}" ${p.status !== 'approved' ? 'disabled' : ''}><span class="h">${p.liked ? '❤️' : '🤍'}</span>${p.like_count || ''}</button>
      <button class="icon cbtn" data-act="comments" data-id="${p.id}" ${p.status !== 'approved' ? 'disabled' : ''}>💬 ${p.comments.length || ''}</button>
      <span class="sp"></span>
      ${canEdit ? `<button class="icon" data-act="mine" data-id="${p.id}" aria-label="내 글 메뉴">⋯</button>` : ''}
    </div>
  </div>`;
}

// ---------- 시트 ----------
function openSheet(html, onMount){
  const root = $('#sheet');
  root.innerHTML = `<div class="sheet-bg"><div class="sheet">${html}</div></div>`;
  const bg = root.firstElementChild;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  bg.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet);
  onMount && onMount(bg.firstElementChild);
}
function closeSheet(){ $('#sheet').innerHTML = ''; }

// ---------- 쓰기 / 고치기 ----------
function writeSheet(sectionId, post){
  const isCol = S.board.layout === 'columns';
  let sec = post ? post.section_id : (sectionId || S.sections[0]?.id || null);
  let color = post ? post.color : S.lastColor;
  let photoFile = null;                       // 새로 고른 사진
  let photoUrl = post?.image_url || null;     // 이미 붙어 있던 사진
  openSheet(`<h3>${post ? '✏️ 내 글 고치기' : '✏️ 생각 붙이기'}</h3>
    ${isCol && !post && S.sections.length > 1 ? `<div class="lbl">어느 칸에 붙일까?</div><div class="chips">${S.sections.map(s => `<button class="chip ${s.id === sec ? 'on' : ''}" data-sec="${s.id}">${esc(s.title)}</button>`).join('')}</div>` : ''}
    <textarea id="wtxt" maxlength="3000" placeholder="여기에 내 생각을 써 봐요">${esc(post?.content || '')}</textarea>
    <div class="photo-pick">
      <label class="soft" style="display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:16px;background:#F4EDE2;cursor:pointer">📷 사진 붙이기<input id="wimg" type="file" accept="image/*" hidden></label>
      <div class="pv" id="wpv" hidden><img id="wpvimg" alt="미리보기"><button type="button" id="wpvx" aria-label="사진 빼기">✕</button></div>
    </div>
    <div class="lbl">카드 색깔</div>
    <div class="colors">${Object.entries(COLORS).map(([k, v]) => `<button class="cdot ${k === color ? 'on' : ''}" style="background:${v}" data-color="${k}" aria-label="${k}"></button>`).join('')}</div>
    <details ${post?.link_url ? 'open' : ''} style="margin-top:12px"><summary class="muted" style="cursor:pointer;padding:8px 0">🔗 링크 붙이기 (선택)</summary>
      <input id="wlnk" type="url" inputmode="url" placeholder="https://" value="${esc(post?.link_url || '')}"></details>
    <div class="sfoot"><button class="soft" data-close>취소</button><button class="main" id="wgo">${post ? '고치기' : '붙이기!'}</button></div>`, sh => {
    const ta = sh.querySelector('#wtxt');
    if (!post) setTimeout(() => ta.focus(), 60);
    const pv = sh.querySelector('#wpv'), pvimg = sh.querySelector('#wpvimg');
    const showPv = src => { if (src){ pvimg.src = src; pv.hidden = false; } else { pv.hidden = true; pvimg.removeAttribute('src'); } };
    showPv(photoUrl);
    sh.querySelector('#wimg').onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      if (!/^image\//.test(f.type)) return toast('사진 파일만 붙일 수 있어요', true);
      photoFile = f; showPv(URL.createObjectURL(f));
    };
    sh.querySelector('#wpvx').onclick = () => { photoFile = null; photoUrl = null; sh.querySelector('#wimg').value = ''; showPv(null); };
    sh.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { sec = b.dataset.sec; sh.querySelectorAll('[data-sec]').forEach(x => x.classList.toggle('on', x === b)); });
    sh.querySelectorAll('[data-color]').forEach(b => b.onclick = () => { color = b.dataset.color; sh.querySelectorAll('[data-color]').forEach(x => x.classList.toggle('on', x === b)); });
    sh.querySelector('#wgo').onclick = async e => {
      const btn = e.target;
      const txt = ta.value.trim();
      let lnk = sh.querySelector('#wlnk').value.trim();
      if (lnk && !/^https?:\/\//i.test(lnk)) lnk = 'https://' + lnk;
      if (!txt && !photoFile && !photoUrl) return toast('글을 쓰거나 사진을 붙여 줘!', true);
      if (lnk && !safeUrl(lnk)) return toast('링크 주소가 이상해요', true);
      btn.disabled = true;
      try {
        let img = photoUrl;
        if (photoFile){
          btn.textContent = '사진 올리는 중… 📷';
          try { img = await uploadImage(photoFile); }
          catch(err){ toast(errCode(err) === 'BIG' ? '사진이 너무 커요. 다른 사진을 골라 줘' : '사진을 올리지 못했어요. 다시 해 볼까?', true); throw err; }
        }
        const args = { p_token: S.token, p_content: txt, p_link_url: lnk || null, p_color: color, p_image_url: img };
        if (post) await call('update_post', { ...args, p_post_id: post.id });
        else await call('create_post', { ...args, p_section_id: sec });
        S.lastColor = color; closeSheet();
        toast(post ? '고쳤어요!' : (S.board.require_approval ? '붙였어요! 선생님이 확인하면 친구들에게 보여요 ⏳' : '붙였어요! 🎉'));
        ping(); await loadPosts(); render();
      } catch(err){ btn.disabled = false; btn.textContent = post ? '고치기' : '붙이기!'; }
    };
  });
}

function mineMenu(id){
  const p = S.posts.find(x => x.id === id);
  const canMove = S.board.layout === 'columns' && S.board.allow_student_move && S.sections.length > 1;
  openSheet(`<h3>내 글</h3><div class="menu">
    <button data-m="edit">✏️ 고치기</button>
    ${canMove ? '<button data-m="move">↔️ 다른 칸으로 옮기기</button>' : ''}
    <button data-m="del" style="color:var(--danger)">🗑️ 지우기</button></div>
    <div class="sfoot"><button class="soft" data-close>닫기</button></div>`, sh => {
    sh.querySelector('[data-m=edit]').onclick = () => writeSheet(null, p);
    canMove && (sh.querySelector('[data-m=move]').onclick = () => moveSheet(p));
    sh.querySelector('[data-m=del]').onclick = () => openSheet(`<h3>정말 지울까?</h3><p class="muted">지우면 되돌릴 수 없어요.</p>
      <div class="sfoot"><button class="soft" data-close>아니요</button><button class="main" style="background:var(--danger)" id="dyes">지울래요</button></div>`, s2 => {
      s2.querySelector('#dyes').onclick = async () => {
        try { await call('delete_post', { p_token: S.token, p_post_id: id }); closeSheet(); toast('지웠어요'); ping(); await loadPosts(); render(); } catch(e){}
      };
    });
  });
}
function moveSheet(p){
  openSheet(`<h3>↔️ 어느 칸으로 옮길까?</h3><div class="menu">${S.sections.map(s => `<button data-s="${s.id}" ${s.id === p.section_id ? 'disabled style="opacity:.5"' : ''}>${esc(s.title)}${s.id === p.section_id ? ' (지금 여기)' : ''}</button>`).join('')}</div>
    <div class="sfoot"><button class="soft" data-close>취소</button></div>`, sh => {
    sh.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => {
      const target = b.dataset.s;
      const inTarget = S.posts.filter(x => x.section_id === target);
      const order = (inTarget.length ? Math.max(...inTarget.map(x => x.sort_order || 0)) : 0) + 1;
      try { await call('move_post', { p_token: S.token, p_post_id: p.id, p_section_id: target, p_sort_order: order }); closeSheet(); toast('옮겼어요!'); ping(); await loadPosts(); render(); } catch(e){}
    });
  });
}

// ---------- 좋아요 / 댓글 ----------
async function like(id, btn){
  const p = S.posts.find(x => x.id === id);
  if (!p) return;
  if (S.board.link_status !== 'open') return toast('지금은 보기만 할 수 있어요', true);
  // 먼저 화면에 반영하고, 서버 결과로 맞추기
  p.liked = !p.liked; p.like_count = (p.like_count || 0) + (p.liked ? 1 : -1);
  btn.classList.toggle('on', p.liked); btn.innerHTML = `<span class="h">${p.liked ? '❤️' : '🤍'}</span>${p.like_count || ''}`;
  if (p.liked){ btn.classList.remove('boom'); void btn.offsetWidth; btn.classList.add('boom'); }
  try { await call('toggle_like', { p_token: S.token, p_post_id: id }); ping(); }
  catch(e){ await loadPosts(); render(); }
}
function commentsSheet(id){
  const p = S.posts.find(x => x.id === id);
  if (!p) return;
  const open = S.board.link_status === 'open';
  openSheet(`<h3>💬 댓글</h3>
    <div class="post" style="box-shadow:none;background:${COLORS[p.color] || '#fff'}">${p.image_url ? `<img class="pimg" src="${esc(p.image_url)}" alt="첨부 사진">` : ''}${p.content ? `<div class="txt">${esc(p.content)}</div>` : ''}</div>
    <div id="clist">${p.comments.length ? p.comments.map(c => {
      const n = c.is_mine ? S.me.number : authorNum(c.author);
      return `<div class="cmt"><span class="ani">${c.author === '선생님' ? '👩‍🏫' : ani(n)}</span><div style="flex:1"><div class="cw">${esc(c.is_mine ? '나' : (c.author || '친구'))}</div><div class="ct">${esc(c.content)}</div></div>${c.is_mine && open ? `<button class="icon" data-cdel="${c.id}" aria-label="댓글 지우기">🗑️</button>` : ''}</div>`;
    }).join('') : '<p class="muted">아직 댓글이 없어요. 첫 댓글을 남겨 볼까?</p>'}</div>
    ${open ? `<div style="display:flex;gap:8px;margin-top:14px"><input id="cin" maxlength="500" placeholder="따뜻한 말 한마디 💛"><button class="main" id="cgo" style="white-space:nowrap">보내기</button></div>` : ''}
    <div class="sfoot"><button class="soft" data-close>닫기</button></div>`, sh => {
    const go = sh.querySelector('#cgo');
    go && (go.onclick = async () => {
      const v = sh.querySelector('#cin').value.trim();
      if (!v) return;
      go.disabled = true;
      try { await call('add_comment', { p_token: S.token, p_post_id: id, p_content: v }); ping(); await loadPosts(); render(); commentsSheet(id); }
      catch(e){ go.disabled = false; }
    });
    const cin = sh.querySelector('#cin');
    cin && cin.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); go.click(); } });
    sh.querySelectorAll('[data-cdel]').forEach(b => b.onclick = async () => {
      try { await call('delete_comment', { p_token: S.token, p_comment_id: b.dataset.cdel }); ping(); await loadPosts(); render(); commentsSheet(id); } catch(e){}
    });
  });
}

// ---------- 실시간 ----------
let pollTimer = null, reloading = false;
function startLive(){
  if (S.channel) return;
  S.channel = sb.channel('board:' + CODE).on('broadcast', { event:'changed' }, () => softReload()).subscribe();
  pollTimer = setInterval(softReload, 10000);
}
function stopLive(){
  if (S.channel){ sb.removeChannel(S.channel); S.channel = null; }
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
async function softReload(){
  // 글을 쓰는 중이면 방해하지 않기
  if (reloading || !S.me || $('#sheet').innerHTML || document.hidden) return;
  reloading = true;
  try { await reloadBoard(); } finally { reloading = false; }
}
function ping(){ S.channel && S.channel.send({ type:'broadcast', event:'changed', payload:{} }); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) softReload(); });

// ---------- 버튼 ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.act){
    case 'pick': { const s = S.students.find(x => x.id === id); s.has_pin ? pinPad(s) : join(s); break; }
    case 'logout': openSheet(`<h3>나갈까요?</h3><p class="muted">다음 친구가 이 패드를 쓸 때 눌러 주세요.</p><div class="sfoot"><button class="soft" data-close>아니요</button><button class="main" id="lo">나가기</button></div>`, sh => sh.querySelector('#lo').onclick = () => { closeSheet(); logout(); }); break;
    case 'write': writeSheet(id); break;
    case 'mine': mineMenu(id); break;
    case 'like': like(id, el); break;
    case 'comments': commentsSheet(id); break;
    case 'zoom': openSheet(`<img class="zoomimg" src="${esc(id)}" alt="사진 크게 보기"><div class="sfoot"><button class="soft" data-close>닫기</button></div>`); break;
  }
});

start();
</script>
</body>
</html>
