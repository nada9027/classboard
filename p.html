<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFF9F0">
<meta name="robots" content="noindex, nofollow">
<title>우리 아이 작업물 · 우리반 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
:root{--cream:#FFF9F0;--ink:#3A3550;--ink2:#7A7590;--line:#EEE6DA;--main:#7C8CFF}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:16px}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.top .bear{font-size:44px}
.top h1{font-size:28px;line-height:1.25}
.top .sp{flex:1}
.sub{color:var(--ink2);font-size:14px;margin-bottom:18px;line-height:1.6}
.ro{display:inline-block;background:#E8EBFF;color:#4B57C8;border-radius:999px;padding:3px 12px;font-size:13px}
button{font:inherit;border:0;border-radius:14px;padding:10px 16px;background:#fff;cursor:pointer;box-shadow:0 2px 6px rgba(80,60,40,.08)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.filters button{padding:7px 14px;font-size:14px}
.filters button.on{background:var(--main);color:#fff}
.group{margin-top:26px}
.folder{display:inline-block;background:#F4EDE2;border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink2)}
.group h2{font-size:22px;margin:6px 0 12px}
.group h2 small{font-family:'Gowun Dodum';font-size:13px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
.post{background:#fff;border-radius:18px;padding:14px;box-shadow:0 3px 0 rgba(120,100,80,.07),0 2px 10px rgba(120,100,80,.06);break-inside:avoid}
.post .meta{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink2);margin-bottom:8px;flex-wrap:wrap}
.post .meta .chip{background:#F4EDE2;border-radius:999px;padding:2px 9px}
.post .meta .sp{flex:1}
.post .txt{white-space:pre-wrap;word-break:break-word;line-height:1.65;font-size:16.5px}
.post img{display:block;width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin:2px 0 8px;background:#f3eee6}
.post a.lnk{display:block;margin-top:8px;padding:8px 10px;border-radius:10px;background:#F7F2EA;font-size:13px;color:#4B57C8;text-decoration:none;word-break:break-all}
.post .like{margin-top:8px;font-size:13px;color:var(--ink2)}
.empty,.msg{text-align:center;padding:60px 20px;color:var(--ink2)}
.msg .big{font-size:56px;margin-bottom:10px}
.foot{margin-top:40px;text-align:center;font-size:12px;color:var(--ink2)}
@media print{ .noprint{display:none!important} body{background:#fff} .post{box-shadow:none;border:1px solid #ddd} .wrap{padding:0} }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">불러오는 중…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const CFG = window.CLASSBOARD_CONFIG;
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth: { persistSession:false, autoRefreshToken:false } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CODE = new URLSearchParams(location.search).get('c') || '';
const IMG_EXT = /\.(jpe?g|png|gif|webp|avif|bmp|svg)(\?|#|$)/i;
let DATA = null, FILTER = '';

function safeUrl(u){ try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x : null; } catch(e){ return null; } }
function ytId(u){
  const h = u.hostname.replace(/^www\.|^m\./, '');
  const id = h === 'youtu.be' ? u.pathname.slice(1, 12) : (/youtube\.com$/.test(h) ? (u.searchParams.get('v') || (u.pathname.match(/\/(shorts|embed|live)\/([\w-]{11})/) || [])[2]) : null);
  return id && /^[\w-]{11}$/.test(id) ? id : null;
}
function linkHtml(raw){
  const u = safeUrl(raw); if (!u) return '';
  const url = esc(u.href), yt = ytId(u);
  if (yt) return `<a href="${url}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${yt}/hqdefault.jpg" alt="영상" loading="lazy"></a><a class="lnk" href="${url}" target="_blank" rel="noopener">▶ 유튜브 영상</a>`;
  if (IMG_EXT.test(u.pathname)) return `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="링크 사진" loading="lazy" onerror="this.parentNode.remove()"></a>`;
  return `<a class="lnk" href="${url}" target="_blank" rel="noopener">🔗 ${esc(u.hostname)}</a>`;
}
function msg(big, title, sub){ $('#app').innerHTML = `<div class="msg"><div class="big">${big}</div><h2>${esc(title)}</h2><p>${esc(sub || '')}</p></div>`; }

function render(){
  const d = DATA, s = d.student, c = d.class;
  const items = d.items;
  const groups = [];
  for (const it of items){
    const key = (it.folder_path || '') + '\u0000' + it.board_title;
    let g = groups.find(x => x.key === key);
    if (!g){ g = { key, folder: it.folder_path || '', title: it.board_title, list: [] }; groups.push(g); }
    g.list.push(it);
  }
  const folders = [...new Set(groups.map(g => g.folder.split(' › ')[0] || '기타'))];
  const shown = groups.filter(g => !FILTER || (g.folder.split(' › ')[0] || '기타') === FILTER);
  $('#app').innerHTML = `
    <div class="top"><span class="bear">🧸</span><div><h1>${esc(s.number)}번 ${esc(s.name)}의 작업물</h1>
      <div style="color:var(--ink2);font-size:14px">${esc(c.school_year)} ${esc(c.name)} · 우리반 보드</div></div><span class="sp"></span>
      <span class="ro">👀 보기 전용</span><button class="noprint" onclick="print()">🖨 인쇄</button></div>
    <div class="sub">선생님이 공개한 우리 아이의 글과 사진을 모아 보여 드려요. 이 링크는 보기만 할 수 있고, 친구들의 이름이나 댓글은 보이지 않아요.</div>
    ${folders.length > 1 ? `<div class="filters noprint"><button class="${FILTER ? '' : 'on'}" data-f="">전체 ${items.length}</button>${folders.map(f => `<button class="${FILTER === f ? 'on' : ''}" data-f="${esc(f)}">📁 ${esc(f)}</button>`).join('')}</div>` : ''}
    ${items.length ? shown.map(g => `<div class="group">
        <span class="folder">📁 ${esc(g.folder || '폴더 밖')}</span>
        <h2>${esc(g.title)} <small>${g.list.length}개</small></h2>
        <div class="grid">${g.list.map(p => `<div class="post">
          <div class="meta">${p.section_title ? `<span class="chip">${esc(p.section_title)}</span>` : ''}<span class="sp"></span>${new Date(p.created_at).toLocaleDateString('ko-KR')}</div>
          ${p.image_url && safeUrl(p.image_url) ? `<img src="${esc(p.image_url)}" alt="첨부 사진" loading="lazy">` : ''}
          ${p.content ? `<div class="txt">${esc(p.content)}</div>` : ''}
          ${p.link_url ? linkHtml(p.link_url) : ''}
          ${p.like_count ? `<div class="like">❤️ 친구들이 ${p.like_count}번 좋아했어요</div>` : ''}
        </div>`).join('')}</div></div>`).join('') : '<div class="empty">아직 공개된 작업물이 없어요.</div>'}
    <div class="foot">우리반 보드 · 학부모 안내용 보기 전용 페이지</div>`;
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { FILTER = b.dataset.f; render(); });
}

(async () => {
  if (!/^[0-9a-f]{8,32}$/.test(CODE)) return msg('🔗', '주소가 올바르지 않아요', '선생님께 받은 링크나 QR로 다시 들어와 주세요.');
  const { data, error } = await sb.rpc('get_portfolio', { p_code: CODE });
  if (error) return /NO_SHARE/.test(error.message) ? msg('🔒', '링크가 끊겼거나 없어요', '선생님께 새 링크를 받아 주세요.') : msg('😢', '불러오지 못했어요', '잠시 뒤 다시 열어 주세요.');
  DATA = data; document.title = `${data.student.name}의 작업물 · 우리반 보드`;
  render();
})();
</script>
</body>
</html>
