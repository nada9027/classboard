<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFF9F0">
<title>캔버스 · 우리반 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
:root{color-scheme:light only;--cream:#FFF9F0;--ink:#3A3550;--ink2:#7A7590;--line:#EEE6DA;--main:#7C8CFF;--main-soft:#E8EBFF;--danger:#F06A6A;--sel:#7C8CFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#EFE9DF;color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:16px;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-user-select:none;user-select:none}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:#fff;border-radius:14px;min-height:44px;padding:8px 14px;transition:transform .1s}
button:active{transform:scale(.94)}
button.main{background:var(--main);color:#fff}
button.soft{background:#F4EDE2}

/* 상단 */
.top{position:fixed;left:0;right:0;top:0;height:60px;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(255,249,240,.96);border-bottom:2px solid var(--line)}
.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.gname{background:var(--main-soft);color:#4B57C8;border-radius:999px;padding:4px 12px;font-family:'Jua';font-size:16px;white-space:nowrap}
.online{display:flex;gap:2px;font-size:22px}
.online span{position:relative}
.online span::after{content:'';position:absolute;right:-1px;bottom:1px;width:8px;height:8px;border-radius:50%;background:#3DBE8B;border:2px solid #fff}
.sp{flex:1}
.ro{background:#FFF4BF;border-radius:999px;padding:4px 12px;font-size:14px;white-space:nowrap}
.top select{border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:#fff;max-width:150px}

/* 페이지 줄 */
.pages{position:fixed;left:0;right:0;top:60px;height:52px;z-index:19;display:flex;align-items:center;gap:6px;padding:6px 14px;overflow-x:auto;background:rgba(255,249,240,.9)}
.pg{min-width:44px;min-height:38px;padding:4px 12px;border-radius:12px;background:#fff;border:2px solid var(--line);font-family:'Jua'}
.pg.on{border-color:var(--main);background:var(--main-soft);color:#4B57C8}
.pgadd{background:transparent;border:2px dashed #CFC5B5;color:var(--ink2)}

/* 캔버스 */
.stage{position:fixed;left:0;right:0;top:112px;bottom:0;overflow:hidden;touch-action:none}
.wrap{position:absolute;transform-origin:0 0}
.page{position:absolute;left:0;top:0;width:1600px;height:900px;isolation:isolate;background:#fff;border-radius:18px;box-shadow:0 6px 30px rgba(80,60,40,.12);overflow:hidden;touch-action:none}
.item{position:absolute;touch-action:none}
.item.sel{outline:3px solid var(--sel);outline-offset:3px;border-radius:6px}
.is-teacher .item.locked .lockb{display:block}
.present .lockb{display:none!important}
.lockb{display:none;position:absolute;right:-12px;top:-14px;font-size:20px;pointer-events:none}
.note{border-radius:6px;box-shadow:0 6px 14px rgba(80,60,40,.18);padding:18px}
.note .tx,.textb .tx{width:100%;height:100%;outline:none;white-space:pre-wrap;word-break:break-word;line-height:1.4;overflow:hidden;font-family:'Gowun Dodum',sans-serif}
.textb .tx{font-family:'Jua',sans-serif}
.tx[contenteditable=true]{-webkit-user-select:text;user-select:text;cursor:text;background:rgba(124,140,255,.06)}
.img img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.shape > div:first-child{width:100%;height:100%}
.video{background:#000;border-radius:12px;overflow:hidden}
.video img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;opacity:.92}
.video iframe{width:100%;height:100%;border:0;display:block}
.video .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:68px;border-radius:20px;background:rgba(255,0,0,.9);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}
.video .stop{position:absolute;right:8px;top:8px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3}
.present .item.video{pointer-events:auto}
.stroke svg{width:100%;height:100%;overflow:visible;display:block}
.handle{position:absolute;right:-18px;bottom:-18px;width:36px;height:36px;border-radius:50%;background:var(--sel);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);touch-action:none;z-index:2}
.drawlayer{position:absolute;left:0;top:0;width:1600px;height:900px;pointer-events:none}

/* 도구 막대 */
.tools{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:6px;padding:8px;background:#fff;border-radius:24px;box-shadow:0 8px 28px rgba(80,60,40,.2);max-width:calc(100vw - 20px);overflow-x:auto}
.tool{min-width:58px;min-height:58px;padding:4px 8px;border-radius:18px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:1.1}
.tool small{font-size:11px;color:var(--ink2);margin-top:2px;font-family:'Gowun Dodum'}
.tool.on{background:var(--main-soft)}
.tool.on small{color:#4B57C8}
.sep{width:2px;background:var(--line);margin:6px 2px}

/* 선택한 것 위 작은 막대 */
.ctx{position:fixed;z-index:31;display:flex;gap:4px;padding:6px;background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.ctx button{min-height:44px;min-width:44px;padding:4px 8px;font-size:20px;background:transparent}
.ctx .lbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;padding:4px 6px;line-height:1.1}
.ctx .lbtn small{font-size:11px;color:var(--ink2);margin-top:2px;white-space:nowrap}
.ctx .dot{width:30px;height:30px;min-width:30px;min-height:30px;border-radius:50%;border:3px solid #eee;padding:0;margin:7px 2px}

/* 팝업 */
.pop{position:fixed;z-index:32;left:50%;transform:translateX(-50%);bottom:110px;background:#fff;border-radius:20px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;gap:8px;flex-wrap:wrap;max-width:94vw;align-items:center}
.pop .dot{width:44px;height:44px;min-height:44px;border-radius:50%;border:3px solid #eee;padding:0}
.pop .dot.on{border-color:var(--ink)}
.pop .w{min-width:52px;background:#F4EDE2}
.pop .w.on{background:var(--main);color:#fff}

/* 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(58,53,80,.35);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto}
.sheet{background:#fff;border-radius:26px;padding:22px;width:min(520px,100%);box-shadow:0 20px 50px rgba(0,0,0,.2)}
.sheet h3{font-size:22px;margin-bottom:10px}
.sfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;background:var(--cream)}
.big{font-size:64px}
.muted{color:var(--ink2)}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;width:min(720px,100%);margin-top:10px}
.glist button{min-height:90px;border-radius:20px;font-family:'Jua';font-size:18px;box-shadow:0 3px 0 #EFE5D6}

/* 발표 모드 */
.present{position:fixed;inset:0;z-index:60;background:#26222f;display:flex;align-items:center;justify-content:center}
.present .wrap{position:absolute}
.present .nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;color:#fff;font-family:'Jua';font-size:20px}
.present .nav button{min-width:64px;min-height:56px;font-size:24px;background:rgba(255,255,255,.15);color:#fff}
.present .x{position:fixed;top:14px;right:14px;background:rgba(255,255,255,.15);color:#fff;z-index:2}
.present .item{pointer-events:none}

.toast{position:fixed;left:50%;top:124px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;font-size:15px;max-width:90vw;text-align:center}
.toast.show{opacity:1}.toast.err{background:var(--danger)}
.busy{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:18px 26px;border-radius:20px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.2);font-family:'Jua';font-size:18px}
@media (max-width:700px){ .tool{min-width:50px;min-height:52px;font-size:21px} .top h1{max-width:24vw} }
</style>
</head>
<body>
<div id="app"><div class="center"><div class="big">🎨</div><div class="muted">캔버스를 불러오는 중…</div></div></div>
<div id="layer"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// =====================================================================
// 우리반 보드 — 모둠 캔버스 (학생·선생님 공용)
//   학생: b.html에서 번호(PIN)로 들어온 기록을 그대로 사용
//   선생님: 교사 화면에 로그인되어 있으면 모든 모둠을 고치고 잠글 수 있음
// =====================================================================
const CFG = window.CLASSBOARD_CONFIG;
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const P = new URLSearchParams(location.search);
const CODE = P.get('b') || '';
const W = 1600, H = 900;
const NOTE_COLORS = { lemon:'#FFF4BF', peach:'#FFE0D1', mint:'#D3F5E6', sky:'#D6ECFF', lavender:'#E8DFFF', pink:'#FFDDEA' };
const INK = ['#3A3550','#F06A6A','#FF9F43','#2BB673','#3D8BFD','#9B6BFF','#FFFFFF'];
const ANIMALS = ['🐶','🐱','🐰','🐻','🐼','🦊','🐨','🐯','🦁','🐸','🐷','🐵','🐥','🐧','🦄','🐹','🐮','🐙','🦋','🐞','🐳','🦔','🐿️','🦉','🐢','🐬','🐝','🦕','🐲','🦒','🐌','🦀','🐠','🦩','🐣'];
const ani = n => n ? ANIMALS[(n - 1) % ANIMALS.length] : '🙂';

const S = {
  token:null, me:null, teacher:false, board:null, groups:[], group:null,
  canEdit:false, pages:[], items:new Map(), page:null,
  tool:'select', sel:null, editing:null, scale:1,
  note:'lemon', ink:'#3A3550', width:6, shape:'rect',
  channel:null, online:{}
};

// ---------- 도우미 ----------
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } } };
let tt;
function toast(m, err=false){ const t = $('#toast'); t.textContent = m; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(tt); tt = setTimeout(() => t.className = 'toast', 2300); }
const errCode = e => (String(e?.message || '').match(/^([A-Z_]+):/) || [])[1];
const errMsg = e => { const m = String(e?.message || ''); return /^[A-Z_]+: /.test(m) ? m.slice(m.indexOf(': ') + 2) : '잠깐 문제가 생겼어요'; };
async function call(fn, args={}){
  const { data, error } = await sb.rpc(fn, { p_code: CODE, p_token: S.token, ...args });
  if (error){
    const c = errCode(error);
    if (c === 'NEED_JOIN'){
      // 이 패드의 입장 기록이 만료됨(PIN 초기화 등) → 기록을 지우고 이름 고르기로
      try { localStorage.removeItem('cb_me_' + CODE); localStorage.removeItem('cb_me_last'); } catch(e){}
      location.replace('b.html?b=' + encodeURIComponent(CODE) + '&expired=1'); throw error;
    }
    if (c === 'NOT_MEMBER' && !S.teacher){ toast('이 모둠에서 빠졌어요. 모둠을 다시 골라 줘', true); setTimeout(() => location.replace('c.html?b=' + encodeURIComponent(CODE)), 1200); throw error; }
    if (c === 'BOARD_CLOSED'){ showMsg('🔒', '지금은 닫힌 보드예요', '선생님이 다시 열어 주시면 들어올 수 있어요.'); throw error; }
    toast(errMsg(error), true); throw error;
  }
  return data;
}
function showMsg(icon, title, sub, extra=''){
  closeLayer();
  $('#app').innerHTML = `<div class="center"><div class="big">${icon}</div><h2>${esc(title)}</h2><p class="muted">${esc(sub)}</p>${extra}</div>`;
}
function closeLayer(){ $('#layer').innerHTML = ''; }
function sheet(html, onMount){
  $('#layer').innerHTML = `<div class="sheet-bg"><div class="sheet">${html}</div></div>`;
  const bg = $('#layer').firstElementChild;
  bg.addEventListener('click', e => { if (e.target === bg) closeLayer(); });
  bg.querySelectorAll('[data-close]').forEach(b => b.onclick = closeLayer);
  onMount && onMount(bg.firstElementChild);
}
async function sha256hex(t){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// ---------- 시작 ----------
async function start(){
  if (!CODE) return showMsg('🤔', '주소가 올바르지 않아요', '선생님이 준 링크나 QR로 다시 들어와 주세요.');
  const saved = store.get('cb_me_' + CODE) || store.get('cb_me_last');
  if (saved?.token){ S.token = saved.token; S.me = saved.me; }
  let data;
  try { data = await call('canvas_board'); } catch(e){ return; }
  S.board = data.board; S.groups = data.groups; S.teacher = data.is_teacher;
  S.personal = data.board.canvas_mode === 'individual';
  if (!S.teacher && !S.token) return location.replace('b.html?b=' + encodeURIComponent(CODE));
  document.title = S.board.title + ' · 캔버스';
  const want = P.get('g');
  const mine = S.groups.find(x => x.mine);
  // 선생님: 링크로 연 모둠 / 학생: 자기 모둠 (없으면 고르기)
  if (S.teacher && S.groups.some(x => x.id === want)) return openGroup(want, P.get('present') === '1');
  // 개인용: 학생은 바로 내 캔버스
  if (S.personal && !S.teacher){
    try { const gid = await call('canvas_personal'); const d = await call('canvas_board'); S.groups = d.groups; return openGroup(gid, P.get('present') === '1'); }
    catch(e){ return; }
  }
  if (S.personal && S.teacher && !S.groups.length) return showMsg('🙋', '아직 캔버스를 시작한 학생이 없어요', '교사 화면에서 ‘모든 학생 캔버스 미리 만들기’를 누르면 바로 볼 수 있어요.');
  if (S.personal && S.teacher) return groupPicker('누구 캔버스를 볼까요?', '', false);
  // 학생은 들어올 때마다 모둠을 고름 (모둠이 자주 바뀌니까)
  if (!S.groups.length) return showMsg('🧩', '아직 모둠이 없어요', '선생님이 모둠을 만들면 여기서 함께 그릴 수 있어요.', backBtn());
  if (S.teacher) return groupPicker('어느 모둠을 볼까요?', '', false);
  groupPicker('우리 모둠을 골라 줘!', '내가 속한 모둠을 누르면 친구들과 함께 만들 수 있어요.', true);
}

const backBtn = () => S.teacher ? '' : `<button class="soft" style="margin-top:14px" data-a="logout">← 뒤로 (처음 화면)</button>`;
// 모둠 고르기: 학생은 누르면 그 모둠에 들어감, 선생님은 보기
function groupPicker(title, sub, join){
  showMsg(join ? '🙋' : '🎨', title, sub,
    `<div class="glist">${S.groups.map(x => `<button data-g="${x.id}" ${x.mine ? 'style="outline:3px solid #7C8CFF"' : ''}>${esc(x.name)}${x.mine ? '<div style="font-family:\'Gowun Dodum\';font-size:12px;color:#4B57C8">지금 내 모둠</div>' : ''}<div class="muted" style="font-family:'Gowun Dodum';font-size:13px;min-height:18px">${x.members.map(m => ani(m.number)).join('') || '아직 아무도 없어요'}</div></button>`).join('')}</div>${backBtn()}`);
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const g = S.groups.find(x => x.id === b.dataset.g);
    if (!join || g.mine) return openGroup(g.id);
    sheet(`<h3>${esc(g.name)}에 들어갈까요?</h3>
      <p class="muted">${g.members.length ? '지금 ' + g.members.map(m => `${ani(m.number)} ${esc(m.name)}`).join(', ') + ' 친구가 있어요.' : '첫 번째로 들어가요!'}</p>
      <div class="sfoot"><button class="soft" data-close>← 뒤로</button><button class="main" id="y">들어가기</button></div>`, sh => {
      sh.querySelector('#y').onclick = async () => {
        try {
          await call('canvas_join_group', { p_group: g.id });
          closeLayer();
          const data = await call('canvas_board'); S.groups = data.groups;
          toast(`${g.name}에 들어왔어요! 🎉`); openGroup(g.id);
        } catch(e){ if (/canvas_join_group/.test(e?.message || '')) toast('모둠 고르기 기능이 서버에 아직 없어요. 선생님께 알려 주세요', true); }
      };
    });
  });
}

async function openGroup(gid, present=false){
  S.group = S.groups.find(g => g.id === gid);
  const data = await call('canvas_load', { p_group: gid });
  S.canEdit = data.can_edit; S.pages = data.pages; S.items = new Map(data.items.map(i => [i.id, i]));
  S.page = S.pages.find(p => p.id === S.page?.id) || S.pages[0];
  S.sel = null; S.editing = null; S.tool = S.canEdit ? S.tool : 'select';
  history.replaceState(null, '', `c.html?b=${encodeURIComponent(CODE)}&g=${gid}`);
  renderShell(); renderPage(); joinChannel();
  if (present) startPresent();
}

// ---------- 화면 틀 ----------
function renderShell(){
  document.body.classList.toggle('is-teacher', S.teacher);
  const others = S.groups.filter(g => g.id !== S.group.id);
  $('#app').innerHTML = `
    <header class="top">
      <h1>${esc(S.board.title)}</h1>
      <span class="gname">${S.personal && !S.teacher ? '🙋 내 캔버스' : esc(S.group.name)}</span>
      <div class="online" id="online"></div>
      <span class="sp"></span>
      ${!S.canEdit ? '<span class="ro">👀 구경 중</span>' : ''}
      ${S.teacher && others.length ? `<select id="gsel" aria-label="다른 모둠 보기"><option value="">${S.personal ? '다른 학생 보기' : '다른 모둠 보기'}</option>${S.groups.map(g => `<option value="${g.id}" ${g.id === S.group.id ? 'disabled' : ''}>${esc(g.name)}${g.mine ? ' (우리 모둠)' : ''}</option>`).join('')}</select>` : ''}
      <button class="soft" data-a="present" title="발표하기">▶ 발표</button>
      ${!S.teacher && !S.personal && S.board.link_status === 'open' ? '<button class="soft" data-a="regroup" title="모둠 다시 고르기">🔁 모둠 바꾸기</button>' : ''}
      ${S.teacher ? '<button class="soft" data-a="back" title="교사 화면">✕</button>' : `<button class="soft" data-a="logout" title="다른 친구가 쓸 때">🚪 나가기</button>`}
    </header>
    <div class="pages" id="pages"></div>

  const gs = $('#gsel'); gs && (gs.onchange = () => gs.value && openGroup(gs.value));

}
const tool = (k, ic, label) => `<button class="tool ${S.tool === k ? 'on' : ''}" data-tool="${k}">${ic}<small>${label}</small></button>`;

function renderPages(){
  const el = $('#pages'); if (!el) return;

// 화면 크기에 맞게 페이지 줄이기
function fit(){
  const st = $('#stage'); if (!st) return;
  const pad = 16, bottom = S.canEdit ? 100 : 16;
  const aw = st.clientWidth - pad * 2, ah = st.clientHeight - pad - bottom;
  S.scale = Math.max(0.15, Math.min(aw / W, ah / H));
  const wrap = $('#wrap');
  wrap.style.transform = `scale(${S.scale})`;
  wrap.style.left = Math.round((st.clientWidth - W * S.scale) / 2) + 'px';
  wrap.style.top = pad + 'px';
  placeCtx();
}

// ---------- 아이템 그리기 ----------
function itemsOnPage(){ return [...S.items.values()].filter(i => i.page_id === S.page.id).sort((a, b) => a.z - b.z); }
function itemHtml(i){
  const d = i.data || {};
  let inner = '';
  if (i.kind === 'note') inner = `<div class="tx" style="font-size:${d.fs || 30}px">${esc(d.text || '')}</div>`;
  else if (i.kind === 'text') inner = `<div class="tx" style="font-size:${d.fs || 48}px;color:${esc(d.color || '#3A3550')}">${esc(d.text || '')}</div>`;
  else if (i.kind === 'image') inner = `<img src="${esc(d.src)}" alt="">`;
  else if (i.kind === 'video') inner = S.playing === i.id
      ? `<iframe src="https://www.youtube-nocookie.com/embed/${esc(d.yt)}?autoplay=1&playsinline=1&rel=0&start=${+d.start || 0}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="유튜브 영상"></iframe><div class="stop" data-stop="${i.id}" title="닫기">✕</div>`
      : `<img src="https://i.ytimg.com/vi/${esc(d.yt)}/hqdefault.jpg" alt="영상"><div class="play" data-play="${i.id}" title="재생">▶</div>`;
  else if (i.kind === 'shape') inner = `<div style="background:${esc(d.fill || '#D6ECFF')};border:${d.line ? `6px solid ${esc(d.line)}` : '0'};border-radius:${d.shape === 'ellipse' ? '50%' : '14px'}"></div>`;
  else if (i.kind === 'stroke') inner = `<svg viewBox="0 0 ${d.vw || i.w} ${d.vh || i.h}" preserveAspectRatio="none"><path d="${pathD(d.pts || [])}" fill="none" stroke="${esc(d.color || '#3A3550')}" stroke-width="${d.sw || 6}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
  const cls = { note:'note', text:'textb', image:'img', shape:'shape', stroke:'stroke', video:'video' }[i.kind];
  const bg = i.kind === 'note' ? `background:${NOTE_COLORS[d.color] || NOTE_COLORS.lemon};` : '';
  return `<div class="item ${cls} ${i.locked ? 'locked' : ''} ${S.sel === i.id ? 'sel' : ''}" data-id="${i.id}" style="left:${i.x}px;top:${i.y}px;width:${i.w}px;height:${i.h}px;z-index:${Math.max(-2e9, Math.min(2e9, Math.round(i.z * 1000)))};${bg}">${inner}<span class="lockb">🔒</span>${S.sel === i.id && canTouch(i) ? '<div class="handle" data-h="1"></div>' : ''}</div>`;
}
function pathD(pts){
  if (!pts.length) return '';
  if (pts.length === 1) return `M${pts[0][0]} ${pts[0][1]} l0.1 0`;
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let k = 1; k < pts.length - 1; k++){
    const mx = (pts[k][0] + pts[k + 1][0]) / 2, my = (pts[k][1] + pts[k + 1][1]) / 2;
    d += ` Q${pts[k][0]} ${pts[k][1]} ${mx} ${my}`;
  }
  const L = pts[pts.length - 1]; return d + ` L${L[0]} ${L[1]}`;
}
function renderPage(){
  const pg = $('#page'); if (!pg) return;
  pg.style.background = S.page.background || '#fff';
  pg.innerHTML = itemsOnPage().map(itemHtml).join('');
  placeCtx();
}
function renderItem(id){
  const i = S.items.get(id), old = $(`#page [data-id="${id}"]`);
  if (!i || i.page_id !== S.page.id){ old && old.remove(); if (S.sel === id) select(null); return; }
  if (S.editing === id) return;
  const tmp = document.createElement('div'); tmp.innerHTML = itemHtml(i);
  old ? old.replaceWith(tmp.firstElementChild) : $('#page').appendChild(tmp.firstElementChild);
  if (S.sel === id) placeCtx();
}
const canTouch = i => S.canEdit && (!i.locked || S.teacher);

// ---------- 저장과 동기화 ----------
// 화면에 먼저 반영 → 모둠 친구에게 바로 알림 → 서버에 저장
const saveTimers = {};
function commit(i, now=false){
  i.updated_at = new Date().toISOString();
  S.items.set(i.id, i);
  send('put', { item: i });
  clearTimeout(saveTimers[i.id]);
  const go = () => call('canvas_put', { p_group: S.group.id, p_item: i }).catch(e => { if (errCode(e) !== 'NEED_JOIN') reload(); });
  now ? go() : (saveTimers[i.id] = setTimeout(go, 250));
}
async function remove(id){
  const i = S.items.get(id); if (!i) return;
  S.items.delete(id); renderItem(id); if (S.sel === id) select(null);
  send('del', { id });
  try { await call('canvas_del', { p_group: S.group.id, p_id: id }); } catch(e){ reload(); }
}
function send(type, payload){ S.channel && S.channel.send({ type:'broadcast', event:'op', payload:{ type, from: S.me?.id || 'teacher', ...payload } }); }
function joinChannel(){
  if (S.channel) sb.removeChannel(S.channel);
  S.channel = sb.channel('canvas:' + S.group.id, { config: { presence: { key: S.teacher ? 'teacher' : (S.me?.id || uid()) } } });
  S.channel
    .on('broadcast', { event:'op' }, ({ payload: m }) => onOp(m))
    .on('presence', { event:'sync' }, () => { S.online = S.channel.presenceState(); renderOnline(); })
    .subscribe(status => {
      if (status === 'SUBSCRIBED') S.channel.track({ n: S.me?.number || 0, t: S.teacher });
    });
}
function onOp(m){
  if (m.type === 'put'){
    const cur = S.items.get(m.item.id);
    if (S.drag && S.drag.id === m.item.id) return;
    S.items.set(m.item.id, m.item); renderItem(m.item.id);
  } else if (m.type === 'move'){
    const cur = S.items.get(m.id); if (!cur || (S.drag && S.drag.id === m.id)) return;
    Object.assign(cur, { x: m.x, y: m.y, w: m.w, h: m.h });
    const el = $(`#page [data-id="${m.id}"]`);
    if (el){ el.style.left = m.x + 'px'; el.style.top = m.y + 'px'; el.style.width = m.w + 'px'; el.style.height = m.h + 'px'; }
  } else if (m.type === 'del'){
    S.items.delete(m.id); renderItem(m.id);
  } else if (m.type === 'pages'){
    reload();
  }
}
function renderOnline(){
  const el = $('#online'); if (!el) return;
  const list = Object.values(S.online).map(v => v[0]).filter(Boolean);
  el.innerHTML = list.map(v => `<span title="접속 중">${v.t ? '👩‍🏫' : ani(v.n)}</span>`).join('');
}
let reloading = false;
async function reload(){
  if (reloading || !S.group) return; reloading = true;
  try {
    const data = await call('canvas_load', { p_group: S.group.id });
    S.canEdit = data.can_edit; S.pages = data.pages;
    const keep = S.editing ? S.items.get(S.editing) : null;
    S.items = new Map(data.items.map(i => [i.id, i]));
    if (keep) S.items.set(keep.id, keep);
    if (!S.pages.some(p => p.id === S.page.id)) S.page = S.pages[0];
    renderPages(); if (!S.editing && !S.drag) renderPage();
  } catch(e){} finally { reloading = false; }
}
// 30초마다 맞춰 보기 (실시간이 잠깐 끊겨도 따라잡기)
setInterval(() => { if (!document.hidden && !S.editing && !S.drag && !$('.present')) reload(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) reload(); });

// ---------- 고르기 / 작은 막대 ----------
function playVideo(id){
  const prev = S.playing; S.playing = id;
  if (prev && prev !== id) renderItem(prev);
  if (id) renderItem(id);
}
function select(id){
  if (S.playing && S.playing !== id) playVideo(null);
  const prev = S.sel; S.sel = id;
  if (prev && prev !== id){ stopEdit(); renderItem(prev); }
  if (id) renderItem(id);
  placeCtx();
}
function placeCtx(){
  document.querySelectorAll('.ctx').forEach(x => x.remove());
  const i = S.sel && S.items.get(S.sel);
  if (!i || !S.canEdit || S.tool !== 'select' || $('.present')) return;
  const el = $(`#page [data-id="${i.id}"]`); if (!el) return;
  const r = el.getBoundingClientRect();
  const ctx = document.createElement('div'); ctx.className = 'ctx';
  let html = '';
  if (canTouch(i)){
    if (i.kind === 'note') html += Object.entries(NOTE_COLORS).map(([k, v]) => `<button class="dot" style="background:${v};${i.data.color === k ? 'border-color:#3A3550' : ''}" data-c="note:${k}"></button>`).join('');
    if (i.kind === 'text' || i.kind === 'shape') html += INK.slice(0, 6).map(v => `<button class="dot" style="background:${v}" data-c="${i.kind === 'text' ? 'text' : 'fill'}:${v}"></button>`).join('');
    if (i.kind === 'note' || i.kind === 'text') html += lb('fs:-', 'A−', '작게') + lb('fs:+', 'A＋', '크게') + lb('edit', '✏️', '글 고치기');
    html += lb('z:top', '⏫', '맨 위로') + lb('z:up', '🔼', '위로') + lb('z:down', '🔽', '아래로') + lb('z:bottom', '⏬', '맨 아래로')
          + lb('dup', '📄', '복사') + lb('del', '🗑️', '지우기');
  }
  if (S.teacher) html += lb('lock', i.locked ? '🔓' : '🔒', i.locked ? '잠금 풀기' : '잠그기');
  if (!html) return;
  ctx.innerHTML = html;
  document.body.appendChild(ctx);
  const cw = ctx.offsetWidth, top = r.top - ctx.offsetHeight - 14;
  ctx.style.left = Math.max(8, Math.min(innerWidth - cw - 8, r.left + r.width / 2 - cw / 2)) + 'px';
  ctx.style.top = (top < 116 ? Math.min(innerHeight - 160, r.bottom + 26) : top) + 'px';
  ctx.querySelectorAll('[data-c]').forEach(b => b.onclick = e => { e.stopPropagation(); ctxAct(b.dataset.c, i); });
}
function ctxAct(c, i){
  const [k, v] = c.split(':');
  if (k === 'note'){ i.data = { ...i.data, color: v }; S.note = v; commit(i); renderItem(i.id); }
  else if (k === 'text'){ i.data = { ...i.data, color: v }; commit(i); renderItem(i.id); }
  else if (k === 'fill'){ i.data = { ...i.data, fill: v }; commit(i); renderItem(i.id); }
  else if (k === 'fs'){ const base = i.kind === 'note' ? 30 : 48; i.data = { ...i.data, fs: Math.max(16, Math.min(160, (i.data.fs || base) + (v === '+' ? 6 : -6))) }; commit(i); renderItem(i.id); }
  else if (k === 'edit') startEdit(i.id);
  else if (k === 'z'){ layer(i, v); }
  else if (k === 'dup'){ const n = { ...i, id: uid(), x: i.x + 30, y: i.y + 30, z: maxZ() + 1, locked:false, data: { ...i.data } }; commit(n, true); renderItem(n.id); select(n.id); }
  else if (k === 'del') remove(i.id);
  else if (k === 'lock'){ i.locked = !i.locked; commit(i, true); renderItem(i.id); toast(i.locked ? '🔒 잠갔어요. 학생은 움직이거나 지울 수 없어요' : '🔓 잠금을 풀었어요'); }
  placeCtx();
}
const maxZ = () => Math.max(0, ...itemsOnPage().map(i => i.z));
const minZ = () => Math.min(0, ...itemsOnPage().map(i => i.z));
// 레이어 순서 바꾸기: top / up / down / bottom
// 고른 것 하나의 순서값만 바꿔서(이웃 사이 값), 잠긴 것은 건드리지 않음
function layer(i, how){
  const list = itemsOnPage();                     // 아래 → 위 순서
  const k = list.findIndex(x => x.id === i.id);
  if (how === 'top' || how === 'up'){
    if (k === list.length - 1) return toast('이미 맨 위예요');
    if (how === 'top') i.z = list[list.length - 1].z + 1;
    else { const o = list[k + 1], n = list[k + 2]; i.z = n ? (o.z + n.z) / 2 : o.z + 1; }
  } else {
    if (k === 0) return toast('이미 맨 아래예요');
    if (how === 'bottom') i.z = list[0].z - 1;
    else { const o = list[k - 1], n = list[k - 2]; i.z = n ? (o.z + n.z) / 2 : o.z - 1; }
  }
  commit(i, true); renderItem(i.id); placeCtx();
}
const lb = (c, ic, t) => `<button class="lbtn" data-c="${c}"><span>${ic}</span><small>${t}</small></button>`;

// ---------- 글 고치기 ----------
function startEdit(id){
  const i = S.items.get(id); if (!i || !canTouch(i)) return;
  S.editing = id;
  const el = $(`#page [data-id="${id}"] .tx`); if (!el) return;
  el.contentEditable = 'true'; el.focus();
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  el.onblur = () => stopEdit();
}
function stopEdit(){
  const id = S.editing; if (!id) return;
  S.editing = null;
  const el = $(`#page [data-id="${id}"] .tx`), i = S.items.get(id);
  if (!el || !i) return;
  el.contentEditable = 'false';
  const text = el.innerText.replace(/\n$/, '');
  if (!text.trim() && i.kind === 'text'){ remove(id); return; }
  if (text !== (i.data.text || '')){ i.data = { ...i.data, text: text.slice(0, 1000) }; commit(i, true); }
}

// ---------- 만들기 ----------
function addItem(kind, x, y, extra={}){
  const size = { note:[300, 260], text:[520, 90], shape:[280, 200] }[kind] || [200, 200];
  const i = { id: uid(), page_id: S.page.id, kind, x: Math.max(0, Math.min(W - size[0], x - size[0] / 2)), y: Math.max(0, Math.min(H - size[1], y - size[1] / 2)),
              w: size[0], h: size[1], z: maxZ() + 1, locked:false, data: {} };
  if (kind === 'note') i.data = { text:'', color: S.note, fs: 30 };
  if (kind === 'text') i.data = { text:'', color: S.ink === '#FFFFFF' ? '#3A3550' : S.ink, fs: 48 };
  if (kind === 'shape') i.data = { shape: S.shape, fill: '#D6ECFF' };
  Object.assign(i.data, extra);
  S.items.set(i.id, i); renderItem(i.id);
  setTool('select'); select(i.id);
  if (kind === 'note' || kind === 'text'){ startEdit(i.id); }
  commit(i, true);
  return i;
}

// 유튜브 주소 → 영상 번호(11자리), 시작 시간
function parseYouTube(url){
  let u; try { u = new URL(url.trim().replace(/^(?!https?:)/, 'https://')); } catch(e){ return null; }
  const host = u.hostname.replace(/^www\.|^m\.|^music\./, '');
  let id = null;
  if (host === 'youtu.be') id = u.pathname.slice(1, 12);
  else if (/(^|\.)youtube(-nocookie)?\.com$/.test(host)){
    id = u.searchParams.get('v') || (u.pathname.match(/\/(embed|shorts|live|v)\/([A-Za-z0-9_-]{11})/) || [])[2];
  }
  if (!id || !/^[A-Za-z0-9_-]{11}$/.test(id)) return null;
  const t = u.searchParams.get('t') || u.searchParams.get('start') || '';
  const m = String(t).match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/);
  const start = m ? (+(m[1] || 0)) * 3600 + (+(m[2] || 0)) * 60 + (+(m[3] || 0)) : 0;
  return { yt: id, start };
}
function videoSheet(){
  sheet(`<h3>▶️ 영상 넣기</h3>
    <p class="muted" style="font-size:14px;line-height:1.6">유튜브에서 <b>공유 → 링크 복사</b>를 누르고 여기에 붙여 넣어요.</p>
    <input id="yurl" inputmode="url" placeholder="https://youtu.be/..." style="width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;-webkit-user-select:text;user-select:text">
    <div id="yprev" style="margin-top:12px"></div>
    <div class="sfoot"><button class="soft" data-close>취소</button><button class="main" id="ygo">넣기</button></div>`, sh => {
    const inp = sh.querySelector('#yurl'), prev = sh.querySelector('#yprev');
    setTimeout(() => inp.focus(), 60);
    inp.oninput = () => { const v = parseYouTube(inp.value); prev.innerHTML = v ? `<img src="https://i.ytimg.com/vi/${v.yt}/mqdefault.jpg" style="width:100%;border-radius:12px" alt="미리보기">` : (inp.value.trim() ? '<span class="muted" style="font-size:14px">유튜브 주소가 아니에요</span>' : ''); };
    sh.querySelector('#ygo').onclick = () => {

}

// 사진: 1600px로 줄여 올리기
async function onPickImage(e){
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (!/^image\//.test(f.type)) return toast('사진 파일만 넣을 수 있어요', true);
  const busy = document.createElement('div'); busy.className = 'busy'; busy.textContent = '📷 사진 올리는 중…'; document.body.appendChild(busy);
  try {
    let src;
    try { src = await createImageBitmap(f, { imageOrientation:'from-image' }); }
    catch(err){ src = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(f); }); }
    const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight;
    const k = Math.min(1, 1600 / Math.max(w0, h0));
    const c = document.createElement('canvas'); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(src, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.84));
    const folder = S.teacher ? 'teacher' : await sha256hex(S.token);
    const path = `${CODE}/${folder}/${uid()}.jpg`;
    const { error } = await sb.storage.from('post-images').upload(path, blob, { contentType:'image/jpeg', upsert:false });
    if (error) throw error;
    const url = sb.storage.from('post-images').getPublicUrl(path).data.publicUrl;
    const fitk = Math.min(1, 640 / c.width, 520 / c.height);
    const i = { id: uid(), page_id: S.page.id, kind:'image', w: Math.round(c.width * fitk), h: Math.round(c.height * fitk), z: maxZ() + 1, locked:false, data:{ src: url } };
    i.x = Math.round((W - i.w) / 2); i.y = Math.round((H - i.h) / 2);
    S.items.set(i.id, i); renderItem(i.id); setTool('select'); select(i.id); commit(i, true);
  } catch(err){ toast('사진을 올리지 못했어요. 다시 해 볼까?', true); }
  finally { busy.remove(); }
}

// ---------- 손가락 / 펜 동작 ----------
const toPage = e => { const r = $('#page').getBoundingClientRect(); return [(e.clientX - r.left) / S.scale, (e.clientY - r.top) / S.scale]; };
let lastTap = { id:null, t:0 };
let stroke = null;

document.addEventListener('pointerdown', e => {
  if (!S.group || $('.present') || $('#layer').innerHTML) return;
  if (!e.target.closest('#stage')) return;
  if (S.editing && e.target.closest(`[data-id="${S.editing}"] .tx`)) return;   // 글 쓰는 중
  const pl = e.target.closest('[data-play]'), st = e.target.closest('[data-stop]');
  if (pl || st){ e.preventDefault(); playVideo(pl ? pl.dataset.play : null); return; }
  const [px, py] = toPage(e);
  const itemEl = e.target.closest('.item');
  const id = itemEl?.dataset.id, it = id && S.items.get(id);

  if (!S.canEdit){ return; }

  if (S.tool === 'pen'){
    e.preventDefault();
    stroke = { pts:[[px, py]], el: document.createElementNS('http://www.w3.org/2000/svg', 'path'), pid: e.pointerId };
    stroke.el.setAttribute('fill', 'none'); stroke.el.setAttribute('stroke', S.ink); stroke.el.setAttribute('stroke-width', S.width);
    stroke.el.setAttribute('stroke-linecap', 'round'); stroke.el.setAttribute('stroke-linejoin', 'round');
    $('#draw').appendChild(stroke.el);
    return;
  }
  if (S.tool === 'eraser'){ e.preventDefault(); S.erasing = true; eraseAt(e); return; }
  if (S.tool === 'note' || S.tool === 'text' || S.tool === 'shape'){ e.preventDefault(); addItem(S.tool, px, py); return; }

  // 고르기
  if (!it){ stopEdit(); select(null); return; }
  if (S.editing === id) return;
  const now = Date.now();
  if (lastTap.id === id && now - lastTap.t < 350 && (it.kind === 'note' || it.kind === 'text')){ select(id); startEdit(id); return; }
  lastTap = { id, t: now };
  if (!canTouch(it)){ select(id); if (it.locked) toast('🔒 선생님이 고정한 거예요'); return; }
  e.preventDefault();
  stopEdit(); select(id);
  const resize = !!e.target.closest('.handle');
  S.drag = { id, resize, sx: px, sy: py, ox: it.x, oy: it.y, ow: it.w, oh: it.h, moved:false, last:0 };
}, { passive:false });

document.addEventListener('pointermove', e => {
  if (stroke && e.pointerId === stroke.pid){
    const [px, py] = toPage(e), L = stroke.pts[stroke.pts.length - 1];
    if (Math.hypot(px - L[0], py - L[1]) > 2.5 / S.scale){ stroke.pts.push([px, py]); stroke.el.setAttribute('d', pathD(stroke.pts)); }
    return;
  }
  if (S.erasing){ eraseAt(e); return; }
  const d = S.drag; if (!d) return;
  const [px, py] = toPage(e), it = S.items.get(d.id); if (!it) return;
  const dx = px - d.sx, dy = py - d.sy;
  if (!d.moved && Math.hypot(dx, dy) < 4) return;
  d.moved = true; document.querySelectorAll('.ctx').forEach(x => x.remove());
  if (d.resize){
    const ratio = it.kind === 'image' || it.kind === 'video' ? d.oh / d.ow : null;
    it.w = Math.max(40, Math.min(W, d.ow + dx));
    it.h = ratio ? it.w * ratio : Math.max(30, Math.min(H, d.oh + dy));
  } else {
    it.x = Math.max(-it.w + 40, Math.min(W - 40, d.ox + dx));
    it.y = Math.max(-it.h + 40, Math.min(H - 40, d.oy + dy));
  }
  const el = $(`#page [data-id="${d.id}"]`);
  el.style.left = it.x + 'px'; el.style.top = it.y + 'px'; el.style.width = it.w + 'px'; el.style.height = it.h + 'px';
  const t = performance.now();
  if (t - d.last > 70){ d.last = t; send('move', { id: it.id, x: it.x, y: it.y, w: it.w, h: it.h }); }
});

document.addEventListener('pointerup', endPointer);
document.addEventListener('pointercancel', endPointer);
function endPointer(e){
  if (stroke && e.pointerId === stroke.pid){
    const s = stroke; stroke = null; s.el.remove();
    if (s.pts.length < 2 && S.width < 3) return;
    const xs = s.pts.map(p => p[0]), ys = s.pts.map(p => p[1]);
    const pad = S.width;
    const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad, x1 = Math.max(...xs) + pad, y1 = Math.max(...ys) + pad;
    const w = Math.max(8, x1 - x0), h = Math.max(8, y1 - y0);
    const pts = s.pts.map(p => [Math.round((p[0] - x0) * 10) / 10, Math.round((p[1] - y0) * 10) / 10]);
    const i = { id: uid(), page_id: S.page.id, kind:'stroke', x: x0, y: y0, w, h, z: maxZ() + 1, locked:false, data:{ pts, color: S.ink, sw: S.width, vw: w, vh: h } };
    S.items.set(i.id, i); renderItem(i.id); commit(i, true);
    return;
  }
  if (S.erasing){ S.erasing = false; return; }
  const d = S.drag; S.drag = null;
  if (!d) return;                       // 막대 버튼 등 다른 곳을 누른 경우엔 그대로 두기
  if (d.moved){ const it = S.items.get(d.id); if (it){ commit(it, true); renderItem(it.id); } }
  placeCtx();
}
function eraseAt(e){
  const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('.item');
  const it = el && S.items.get(el.dataset.id);
  if (it && it.kind === 'stroke' && canTouch(it)) remove(it.id);
}

// ---------- 도구 ----------
function setTool(t){
  S.tool = t;
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  document.querySelectorAll('.pop').forEach(x => x.remove());
  const st = $('#stage'); if (st) st.style.cursor = t === 'pen' ? 'crosshair' : t === 'eraser' ? 'cell' : 'default';
  if (t !== 'select'){ stopEdit(); select(null); }
}
function toolPop(t){
  document.querySelectorAll('.pop').forEach(x => x.remove());
  const pop = document.createElement('div'); pop.className = 'pop';
  if (t === 'note') pop.innerHTML = `<span class="muted" style="font-size:14px">색을 고르고 화면을 누르세요</span>` + Object.entries(NOTE_COLORS).map(([k, v]) => `<button class="dot ${S.note === k ? 'on' : ''}" style="background:${v}" data-v="${k}"></button>`).join('');
  else if (t === 'pen') pop.innerHTML = INK.map(v => `<button class="dot ${S.ink === v ? 'on' : ''}" style="background:${v}" data-v="${v}"></button>`).join('') + `<span class="sep"></span>` + [3, 6, 12, 24].map(w => `<button class="w ${S.width === w ? 'on' : ''}" data-w="${w}"><span style="display:inline-block;width:${Math.min(w, 20)}px;height:${Math.min(w, 20)}px;border-radius:50%;background:currentColor"></span></button>`).join('');
  else if (t === 'shape') pop.innerHTML = `<button class="w ${S.shape === 'rect' ? 'on' : ''}" data-s="rect">⬛ 네모</button><button class="w ${S.shape === 'ellipse' ? 'on' : ''}" data-s="ellipse">⚫ 동그라미</button><span class="muted" style="font-size:14px">고르고 화면을 누르세요</span>`;
  else if (t === 'text') pop.innerHTML = `<span class="muted" style="font-size:14px">글자를 넣을 곳을 누르세요</span>`;
  else if (t === 'eraser') pop.innerHTML = `<span class="muted" style="font-size:14px">펜 그림 위를 문지르면 지워져요</span>`;
  else return;
  document.body.appendChild(pop);
  pop.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { if (t === 'note') S.note = b.dataset.v; else S.ink = b.dataset.v; toolPop(t); });
  pop.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { S.width = +b.dataset.w; toolPop(t); });
  pop.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.shape = b.dataset.s; toolPop(t); });
}

// ---------- 페이지 ----------
async function pageAdd(){
  const idx = S.pages.findIndex(p => p.id === S.page.id);
  const a = S.pages[idx].sort_order, b = S.pages[idx + 1]?.sort_order;
  const sort = b == null ? a + 1 : (a + b) / 2;
  const id = await call('canvas_page_add', { p_group: S.group.id, p_sort: sort });
  S.pages.splice(idx + 1, 0, { id, sort_order: sort, background:'#FFFFFF' });
  S.page = S.pages[idx + 1]; select(null); renderPages(); renderPage(); send('pages', {});
}
function pageMenu(){
  const idx = S.pages.findIndex(p => p.id === S.page.id);
  sheet(`<h3>${idx + 1}쪽</h3><div style="display:flex;flex-direction:column;gap:8px">
    <button class="soft" data-m="left" ${idx === 0 ? 'disabled' : ''}>⬅️ 앞으로 보내기</button>
    <button class="soft" data-m="right" ${idx === S.pages.length - 1 ? 'disabled' : ''}>➡️ 뒤로 보내기</button>
    <div class="muted" style="font-size:14px;margin-top:4px">배경색</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${['#FFFFFF','#FFF9F0','#FFF4BF','#D3F5E6','#D6ECFF','#E8DFFF','#FFDDEA','#2F3B4B'].map(c => `<button data-bg="${c}" style="width:48px;height:48px;border-radius:50%;padding:0;background:${c};border:3px solid ${c === S.page.background ? '#3A3550' : '#eee'}"></button>`).join('')}</div>
    <button data-m="del" style="color:var(--danger);background:#FFE6E6;margin-top:8px" ${S.pages.length <= 1 ? 'disabled' : ''}>🗑️ 이 쪽 지우기</button>
  </div><div class="sfoot"><button class="soft" data-close>닫기</button></div>`, sh => {
    sh.querySelectorAll('[data-m]').forEach(b => b.onclick = async () => {
      const m = b.dataset.m;
      if (m === 'del'){
        sheet(`<h3>${idx + 1}쪽을 지울까요?</h3><p class="muted">이 쪽에 있는 것이 모두 지워지고 되돌릴 수 없어요.</p><div class="sfoot"><button class="soft" data-close>아니요</button><button class="main" style="background:var(--danger)" id="y">지울래요</button></div>`, s2 => {
          s2.querySelector('#y').onclick = async () => { try { await call('canvas_page_del', { p_group: S.group.id, p_page: S.page.id }); closeLayer(); send('pages', {}); S.page = S.pages[Math.max(0, idx - 1)]; await reload(); } catch(e){} };
        });
        return;
      }
      const j = m === 'left' ? idx - 1 : idx + 1;
      const other = S.pages[j], k = m === 'left' ? j - 1 : j + 1;
      const nb = S.pages[k]?.sort_order;
      const sort = nb == null ? other.sort_order + (m === 'left' ? -1 : 1) : (other.sort_order + nb) / 2;
      try { await call('canvas_page_move', { p_group: S.group.id, p_page: S.page.id, p_sort: sort }); closeLayer(); send('pages', {}); await reload(); } catch(e){}
    });
    sh.querySelectorAll('[data-bg]').forEach(b => b.onclick = async () => {
      // 배경색은 선생님 표(표 권한)로, 학생은 큰 네모 도형으로 대신
      S.page.background = b.dataset.bg; renderPage(); closeLayer();
      if (S.teacher){ await sb.from('canvas_pages').update({ background: b.dataset.bg }).eq('id', S.page.id); send('pages', {}); }
      else {
        const bgItem = { id: uid(), page_id: S.page.id, kind:'shape', x:0, y:0, w:W, h:H, z: Math.min(0, ...itemsOnPage().map(i => i.z)) - 1, locked:false, data:{ shape:'rect', fill: b.dataset.bg } };
        S.items.set(bgItem.id, bgItem); S.page.background = '#FFFFFF'; renderPage(); commit(bgItem, true);
      }
    });
  });
}


// ---------- 레이어 목록 ----------
function itemLabel(i){
  const d = i.data || {};
  if (i.kind === 'note') return ['🟨', '포스트잇', (d.text || '').split('\n')[0].slice(0, 18) || '(빈 포스트잇)'];
  if (i.kind === 'text') return ['🔤', '글자', (d.text || '').split('\n')[0].slice(0, 18) || '(빈 글자)'];
  if (i.kind === 'image') return ['📷', '사진', ''];
  if (i.kind === 'video') return ['▶️', '영상', '유튜브'];
  if (i.kind === 'shape') return [d.shape === 'ellipse' ? '⚫' : '⬛', d.shape === 'ellipse' ? '동그라미' : '네모', ''];
  return ['✏️', '펜 그림', ''];
}
function layersSheet(){
  const list = itemsOnPage().slice().reverse();          // 위 → 아래
  const thumb = i => i.kind === 'image' ? `<img src="${esc(i.data.src)}" style="width:44px;height:32px;object-fit:cover;border-radius:6px">`
    : i.kind === 'video' ? `<img src="https://i.ytimg.com/vi/${esc(i.data.yt)}/default.jpg" style="width:44px;height:32px;object-fit:cover;border-radius:6px">`
    : i.kind === 'note' ? `<span style="display:inline-block;width:44px;height:32px;border-radius:6px;background:${NOTE_COLORS[i.data.color] || NOTE_COLORS.lemon}"></span>`
    : i.kind === 'shape' ? `<span style="display:inline-block;width:44px;height:32px;border-radius:${i.data.shape === 'ellipse' ? '50%' : '6px'};background:${esc(i.data.fill || '#D6ECFF')}"></span>`
    : `<span style="display:inline-block;width:44px;text-align:center;font-size:22px">${itemLabel(i)[0]}</span>`;
  sheet(`<h3>🗂 레이어 <span class="muted" style="font-family:'Gowun Dodum';font-size:14px">위에 있을수록 앞에 보여요</span></h3>
    ${list.length ? `<div style="display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto">${list.map((i, k) => { const [ic, name, sub] = itemLabel(i); const can = canTouch(i); return `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:${S.sel === i.id ? 'var(--main-soft)' : '#FBF6EE'}">
        <button data-ly="sel:${i.id}" style="flex:1;display:flex;align-items:center;gap:10px;background:transparent;padding:0;min-height:40px;text-align:left">${thumb(i)}<span><b style="font-weight:400">${ic} ${name}</b>${sub ? `<br><span class="muted" style="font-size:12px">${esc(sub)}</span>` : ''}</span></button>
        ${i.locked ? '<span title="잠김">🔒</span>' : ''}
        ${can ? `<button data-ly="up:${i.id}" ${k === 0 ? 'disabled style="opacity:.3"' : ''} aria-label="위로">🔼</button><button data-ly="down:${i.id}" ${k === list.length - 1 ? 'disabled style="opacity:.3"' : ''} aria-label="아래로">🔽</button>` : ''}
      </div>`; }).join('')}</div>` : '<p class="muted">이 쪽에는 아직 아무것도 없어요.</p>'}
    <div class="sfoot"><button class="soft" data-close>닫기</button></div>`, sh => {
    sh.querySelectorAll('[data-ly]').forEach(b => b.onclick = () => {
      const [how, id] = b.dataset.ly.split(':'), it = S.items.get(id);
      if (!it) return;
      if (how === 'sel'){ closeLayer(); setTool('select'); select(id); return; }
      layer(it, how); layersSheet();
    });
  });
}

// ---------- 발표 ----------
let pIdx = 0;
function startPresent(){
  select(null); stopEdit();
  pIdx = Math.max(0, S.pages.findIndex(p => p.id === S.page.id));
  const el = document.createElement('div'); el.className = 'present';
  el.innerHTML = `<button class="x" data-p="x">✕ 닫기</button><div class="wrap" id="pwrap"><div class="page" id="ppage"></div></div>
    <div class="nav"><button data-p="prev">‹</button><span id="pnum"></span><button data-p="next">›</button></div>`;
  document.body.appendChild(el);
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const p = b.dataset.p; S.playing = null; if (p === 'x'){ el.remove(); renderPage(); } else { pIdx = Math.max(0, Math.min(S.pages.length - 1, pIdx + (p === 'next' ? 1 : -1))); drawPresent(); } });
  try { document.documentElement.requestFullscreen?.(); } catch(e){}
  drawPresent();
}
document.addEventListener('click', e => {
  if (!$('.present')) return;
  const pl = e.target.closest('[data-play]'), st = e.target.closest('[data-stop]');
  if (pl || st){ S.playing = pl ? pl.dataset.play : null; drawPresent(); }
});
function drawPresent(){
  const pg = S.pages[pIdx], el = $('#ppage'); if (!el) return;
  el.style.background = pg.background || '#fff';
  const save = S.sel; S.sel = null;
  el.innerHTML = [...S.items.values()].filter(i => i.page_id === pg.id).sort((a, b) => a.z - b.z).map(itemHtml).join('');
  S.sel = save;
  $('#pnum').textContent = `${pIdx + 1} / ${S.pages.length}`;
  fitPresent();
}
function fitPresent(){
  const k = Math.min(innerWidth / W, (innerHeight - 90) / H);
  const w = $('#pwrap'); if (!w) return;
  w.style.transform = `scale(${k})`; w.style.left = (innerWidth - W * k) / 2 + 'px'; w.style.top = Math.max(10, (innerHeight - 80 - H * k) / 2) + 'px';
}
document.addEventListener('keydown', e => {
  if ($('.present')){
    if (e.key === 'ArrowRight' || e.key === ' ') $('[data-p=next]').click();
    if (e.key === 'ArrowLeft') $('[data-p=prev]').click();
    if (e.key === 'Escape'){ $('.present').remove(); S.playing = null; renderPage(); }
    return;
  }
  if (S.editing) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel){ const it = S.items.get(S.sel); if (it && canTouch(it)) remove(it.id); }
});

// ---------- 버튼 ----------
document.addEventListener('click', async e => {
  const tb = e.target.closest('[data-tool]');
  if (tb){
    const t = tb.dataset.tool;
    if (t === 'image'){ setTool('select'); $('#file').click(); return; }
    if (t === 'video'){ setTool('select'); videoSheet(); return; }
    setTool(t); toolPop(t); return;
  }
  const pg = e.target.closest('[data-pg]');
  if (pg){ stopEdit(); select(null); S.playing = null; S.page = S.pages.find(p => p.id === pg.dataset.pg); renderPages(); renderPage(); return; }
  const a = e.target.closest('[data-a]')?.dataset.a;
  if (!a) return;
  try {
    if (a === 'page-add') await pageAdd();
    if (a === 'page-menu') pageMenu();
    if (a === 'layers') layersSheet();
    if (a === 'present') startPresent();
    if (a === 'back') location.href = 'teacher.html';
    if (a === 'regroup'){ if (S.channel){ sb.removeChannel(S.channel); S.channel = null; } const d = await call('canvas_board'); S.groups = d.groups; groupPicker('어느 모둠으로 갈까요?', '다른 모둠을 고르면 지금 모둠에서는 빠져요.', true); }
    if (a === 'logout') sheet(`<h3>나갈까요?</h3><p class="muted">다음 친구가 이 패드를 쓸 때 눌러 주세요.</p><div class="sfoot"><button class="soft" data-close>아니요</button><button class="main" id="y">나가기</button></div>`, sh => sh.querySelector('#y').onclick = () => {
      try { localStorage.removeItem('cb_me_' + CODE); localStorage.removeItem('cb_me_last'); } catch(e){}
      location.replace('b.html?b=' + encodeURIComponent(CODE));
    });
    if (a === 'copy-all'){
      sheet(`<h3>📤 이 쪽을 ${S.personal ? '모든 학생에게' : '모든 모둠에'} 나눠 줄까요?</h3><p class="muted" style="line-height:1.6">${S.personal ? '다른 학생' : '다른 모둠'} 캔버스 맨 뒤에 이 쪽이 복사돼요. 복사된 것은 모두 🔒 잠겨서 학생이 움직일 수 없어요. 활동지나 발표 틀을 나눠 줄 때 쓰세요.</p>
        <div class="sfoot"><button class="soft" data-close>취소</button><button class="main" id="y">나눠 주기</button></div>`, sh => {
        sh.querySelector('#y').onclick = async () => {
          if (S.personal) await sb.rpc('canvas_ensure_all', { p_code: CODE });   // 아직 안 들어온 학생 것도 미리 만들기
          const { data, error } = await sb.rpc('canvas_page_copy_all', { p_code: CODE, p_group: S.group.id, p_page: S.page.id });
          closeLayer(); if (error) return toast(errMsg(error), true);
          toast(S.personal ? `${data}명에게 나눠 줬어요` : `${data}개 모둠에 나눠 줬어요`);
          const d2 = await call('canvas_board'); S.groups = d2.groups;
          for (const g of S.groups) if (g.id !== S.group.id) sb.channel('canvas:' + g.id).send({ type:'broadcast', event:'op', payload:{ type:'pages' } });
        };
      });
    }
  } catch(err){}
});

start();
</script>
</body>
</html>
